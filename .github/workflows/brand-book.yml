name: Design tokens & assets

# Validate the design-system pipeline: rebuild tokens + logo assets and make
# sure the scripts run and the committed tokens.css is in sync. Publishing to
# GitHub Pages is owned solely by the Storybook workflow (one Pages site per repo).

on:
  push:
    branches: [main]
    paths:
      - "tokens/**"
      - "scripts/**"
      - "cowork/design/logos/**"
      - "package.json"
      - ".github/workflows/brand-book.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-tokens
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Rebuild tokens
        run: npm run tokens
      - name: Fail if committed tokens.css is stale
        run: git diff --exit-code -- cowork/design/brand-book/tokens.css
          || (echo "::error::tokens.css is out of sync — run 'npm run tokens' and commit it" && exit 1)
      - name: Rebuild icons (validate the pipeline runs)
        run: npm run icons
      - name: Upload generated tokens.css
        uses: actions/upload-artifact@v4
        with:
          name: tokens-css
          path: cowork/design/brand-book/tokens.css
