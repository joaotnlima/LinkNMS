name: CI

on:
  push:
    # pivot/** gets push CI because the v2 rebuild (LINA-308) lives on a
    # long-running branch with no PR until the founder's cutover approval —
    # without this the whole pivot would build green-by-omission.
    branches: [main, 'pivot/**']
  pull_request:

jobs:
  migrations:
    name: Migrations (forward-only)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: linknms_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply all migrations (forward pass)
        env:
          MIGRATOR_DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: node db/migrate.mjs

      - name: Second run is a no-op (idempotency check)
        env:
          MIGRATOR_DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: node db/migrate.mjs

      # Self-test for the production schema gate (LINA-62). The same checker
      # that guards prod in .github/workflows/prod-schema.yml runs here against
      # this throwaway container, which was just migrated from the tree — so it
      # must report zero drift and a correct grant matrix. Runs on every PR with
      # no credentials, which is the point: the guard is only worth anything if
      # a change that breaks it fails BEFORE it reaches main.
      - name: Production schema checker self-test
        env:
          MIGRATOR_DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: node scripts/check-prod-schema.mjs

  services-tests:
    name: Services — retained unit suites
    runs-on: ubuntu-latest

    # LINA-400 (Phase 12c tail): the v1 service graph (Decision, Change Order,
    # Schedule, the Ledger audit machinery, Analytics) was pruned and its schemas
    # dropped (services/waitlist/migrations/0004). What remains under services/ is
    # the Identity module (the live seat gate + email->party bridge used by
    # app/src/server/seat-gate.ts), Email, Auth, Waitlist, and the pure Ledger
    # utilities (the pg pool + the hash-chain trust anchor) the identity module
    # still imports. These suites are in-memory / pure and need no database.
    #
    # The Postgres integration walk that used to live here (the v1 FR1-FR9
    # acceptance over least-privilege roles, the grant matrix, the golden-record
    # export) retired WITH v1 — there is no v1 mounted surface left to exercise.
    # The forward-only schema gate (the drop migration, idempotency, and the
    # production drift + grant checker) is the `migrations` job above.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/package-lock.json

      # `npm ci` mirrors the Vercel deploy install exactly, so lockfile drift
      # fails here instead of at deploy time (LINA-66). `--ignore-scripts` is a
      # deliberate supply-chain choice; keep it.
      - name: Install dependencies
        working-directory: services
        run: npm ci --ignore-scripts

      # No DATABASE_URL: the remaining identity pg suites (seat / invite reads)
      # skip by convention, exactly as they do on a dev machine with no database.
      # Everything else runs in memory or over pure functions.
      - name: Run retained service unit tests
        working-directory: services
        run: npm test

  openapi-lint:
    name: API v2 — contract lint
    runs-on: ubuntu-latest

    # Contract-first (to-be doc 11) is only real if the contract is held to in
    # CI: unique operationIds, declared path params, resolvable $refs, a
    # security default, and a Swagger embed that matches openapi.yaml. Stdlib
    # + PyYAML on purpose — a linter is no place for npm supply-chain surface.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint the /api/v2 contract
        run: |
          pip install pyyaml
          python3 scripts/openapi-lint.py

  platform-tests:
    name: Platform (v2) — outbox, ledger client, idempotency (Postgres)
    runs-on: ubuntu-latest

    # Phase-0 acceptance (to-be AGENT-INDEX §5): the ledger entry and the
    # outbox row commit in ONE transaction, proven against the real v2
    # migrations in a throwaway container.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: linknms_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      # `npm ci` — same lockfile-drift reasoning as every other job (LINA-66).
      - name: Install dependencies
        working-directory: platform
        run: npm ci --ignore-scripts

      # The suite creates its own throwaway database, so it connects to the
      # maintenance db as the container superuser.
      - name: Run platform tests
        working-directory: platform
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-1 acceptance (AGENT-INDEX §5): the doc-16 §5 matrix has tests,
      # and the identity store proves staffing + its ledger entry commit in
      # ONE transaction, against the same throwaway Postgres.
      - name: Install identity module dependencies
        working-directory: modules/identity
        run: npm ci --ignore-scripts

      - name: Run identity module tests
        working-directory: modules/identity
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-2 acceptance (AGENT-INDEX §5): the doc-09 project transition
      # table has tests, the http layer proves permission ∧ relationship ∧
      # staffing per operation, and the store proves every project write
      # ledgers in ONE transaction against the same throwaway Postgres.
      - name: Install project module dependencies
        working-directory: modules/project
        run: npm ci --ignore-scripts

      - name: Run project module tests
        working-directory: modules/project
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-3 acceptance (AGENT-INDEX §5): the doc-09 contract transition
      # table and the doc-04 V2/V3 projection have tests, the http layer
      # proves permission ∧ relationship ∧ staffing (incl. x-human-only
      # sign), and the store proves contract writes ledger + publish in ONE
      # transaction, one-live-prime (C3) and boq_freeze (§6.2) at DB level.
      - name: Install contracting module dependencies
        working-directory: modules/contracting
        run: npm ci --ignore-scripts

      - name: Run contracting module tests
        working-directory: modules/contracting
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-4 acceptance (AGENT-INDEX §5): the doc-05 link engine
      # (working-day propagation, rigid links, pins, summaries) and the D-33
      # scope are pure-domain tested; the http layer proves the D-26 delta
      # contract (LWW + base + overwrote + client_change_id replay); the
      # store proves plan writes ledger + publish in ONE serialized
      # transaction and the contract.signed consumer baselines idempotently.
      - name: Install planning module dependencies
        working-directory: modules/planning
        run: npm ci --ignore-scripts

      - name: Run planning module tests
        working-directory: modules/planning
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-5 acceptance (AGENT-INDEX §5): checks §8a/8b/8g/8h at API
      # level — verifier ≠ reporting org, only the raiser closes an NC,
      # proposer never decides a change order, measurements against the
      # live BoQ — and the stores prove money/quality writes ledger +
      # publish in ONE transaction against the same throwaway Postgres.
      - name: Install quality module dependencies
        working-directory: modules/quality
        run: npm ci --ignore-scripts

      - name: Run quality module tests
        working-directory: modules/quality
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-6 acceptance (AGENT-INDEX §5): lanes never enter planning
      # roll-ups (they live in tendering.* until signature) and bidders see
      # only their own lane — V8 proven in SQL; the award is ONE transaction
      # (RFP + lanes + contracting's contract draft, or nothing); the
      # winner's plan is copied + baselined only on contract.signed (D-36).
      - name: Install tendering module dependencies
        working-directory: modules/tendering
        run: npm ci --ignore-scripts

      - name: Run tendering module tests
        working-directory: modules/tendering
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-7 acceptance (AGENT-INDEX §5): documents prove the upload
      # protocol (ticket → PUT → complete; sha256 pinned in the signed PUT,
      # nothing visible before the bytes are proven) and V6 scope visibility
      # in SQL; collaboration proves the D-13 question lanes, author-only
      # minute circulation, the activity projection, and the doc-10
      # notification consumers incl. the 15-minute variation digest with
      # DB-level (person, event) dedupe.
      - name: Install documents module dependencies
        working-directory: modules/documents
        run: npm ci --ignore-scripts

      - name: Run documents module tests
        working-directory: modules/documents
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      - name: Install collaboration module dependencies
        working-directory: modules/collaboration
        run: npm ci --ignore-scripts

      - name: Run collaboration module tests
        working-directory: modules/collaboration
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-8 acceptance (AGENT-INDEX §5): the entitlements port answers
      # allowed for any non-gated key even on a CANCELED subscription (reads
      # of signed contracts never blocked — doc 04 §4); gated keys deny when
      # lapsed unless a live sponsorship covers the project; one subscription
      # per org at DB level (canceled slot replaced in place); subscription
      # writes publish billing.subscription.changed and ledger NOTHING
      # (doc 10); the provider webhook 404s for every name (open question 17).
      - name: Install billing module dependencies
        working-directory: modules/billing
        run: npm ci --ignore-scripts

      - name: Run billing module tests
        working-directory: modules/billing
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # LINA-359 acceptance: the audit-ledger READ side. The V7 redaction
      # projection is pure-domain tested; the http layer proves the
      # project.participant ∧ staffing gate and the redaction passthrough; and
      # the store proves — against the same append_event() that wrote it — the
      # scope-visibility join for all four scope kinds AND that verifyChain
      # recomputes the hash chain in SQL and CATCHES a tampered payload.
      - name: Install record module dependencies
        working-directory: modules/record
        run: npm ci --ignore-scripts

      - name: Run record module tests
        working-directory: modules/record
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

  app-typecheck:
    name: App — typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci`, not `npm install`: it installs exactly the lockfile, which is
      # what the deploy target does. An `install` would paper over a dependency
      # that package.json declares but package-lock.json never resolved — the
      # failure mode that took the portal deploy down (`pg`).
      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      # LINA-387 (Phase 12c) + LINA-398: the v1 API is deleted, and the invitation
      # accept deep link now runs on /api/v2 (lib/v2/invitations.ts), so the whole
      # invitation slice — the /api/v1/invitations routes, server/gateway.ts and the
      # v1 transport in lib/api.ts — is gone. The ONLY remaining `@services`
      # references app/src is allowed to carry are the live Clerk auth bridge:
      # `app/src/server/session.ts` (the Clerk → identity.party mapping + the
      # ADR-0008 seat gate) and `app/src/server/seat-gate.ts` (LINA-400), the slim
      # seat-store/party-store pair session.ts now delegates to. LINA-400 split the
      # two identity reads out of @services/gateway/container.mjs so getContainer()
      # — which built the WHOLE v1 service graph — is no longer pulled in by the
      # request path; those two files still read @services/identity + the shared
      # @services/ledger/db.mjs pool helper (no /api/v1 — it is the running auth
      # substrate, not a v1 route). Migrating that last dependency onto @modules so
      # this gate can be fully whitelist-free is tracked separately (LINA-401).
      # Everything else is on `/api/v2` / `@modules`. This gate fails the build if
      # any NEW executable (non-comment) reference creeps back outside those two
      # files, so v1 cannot silently return. Historical references in comments
      # (migration notes explaining why v2 differs) are allowed on purpose.
      - name: v1 deprecation gate (no /api/v1 or @services outside the live auth bridge)
        run: |
          hits=$(grep -rnE "@services|/api/v1" app/src --include='*.ts' --include='*.tsx' \
            | grep -vE 'app/src/server/(session|seat-gate)\.ts' \
            | grep -vE ':[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "::error::v1 API / @services referenced outside the live Clerk auth bridge (server/session.ts) — LINA-387/398:"
            echo "$hits"
            exit 1
          fi
          echo "v1 deprecation gate: clean — no executable v1 references outside server/session.ts."

      - name: Type-check
        working-directory: app
        run: npx tsc --noEmit

      # The typecheck alone cannot see a bundler failure: the API routes import
      # the services from OUTSIDE the Next root, so module resolution for the
      # server bundle is a real risk that only `next build` exercises. This job
      # is the guard that a green CI means a deployable app.
      - name: Build
        working-directory: app
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # The landing page had no CI job at all, which is how `18 / 50` shipped as a
  # hardcoded number and how the persona derivation could have shipped untested.
  # It is a real Next app on a real domain and it now gates like one.
  marketing-typecheck:
    name: Marketing site — typecheck & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20 like the jobs above: `node --test` only learned to expand
      # glob patterns itself in Node 21. On 20 the quoted `src/**/*.test.ts` is
      # passed through verbatim and the runner reports "could not find" — a green
      # local run on 22 and a red CI, for a reason that has nothing to do with
      # the code. 22 is also what Vercel builds this site with.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci`, not `npm install` — same reasoning as the app job above.
      - name: Install dependencies
        working-directory: marketing-site
        run: npm ci --ignore-scripts

      - name: Type-check
        working-directory: marketing-site
        run: npx tsc --noEmit

      # Covers the persona derivation (LINA-189): the rule that a plan overrides
      # a contradicting client-supplied persona is what keeps that column
      # trustworthy, and it is pure logic, so it is cheap to hold to it.
      - name: Run tests
        working-directory: marketing-site
        run: npm test
