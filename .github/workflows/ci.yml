name: CI

on:
  push:
    # pivot/** gets push CI because the v2 rebuild (LINA-308) lives on a
    # long-running branch with no PR until the founder's cutover approval —
    # without this the whole pivot would build green-by-omission.
    branches: [main, 'pivot/**']
  pull_request:

jobs:
  migrations:
    name: Migrations (forward-only)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: linknms_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply all migrations (forward pass)
        env:
          MIGRATOR_DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: node db/migrate.mjs

      - name: Second run is a no-op (idempotency check)
        env:
          MIGRATOR_DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: node db/migrate.mjs

      # Self-test for the production schema gate (LINA-62). The same checker
      # that guards prod in .github/workflows/prod-schema.yml runs here against
      # this throwaway container, which was just migrated from the tree — so it
      # must report zero drift and a correct grant matrix. Runs on every PR with
      # no credentials, which is the point: the guard is only worth anything if
      # a change that breaks it fails BEFORE it reaches main.
      - name: Production schema checker self-test
        env:
          MIGRATOR_DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: node scripts/check-prod-schema.mjs

  ledger-tests:
    name: Ledger — trust-anchor tests (Postgres)
    runs-on: ubuntu-latest

    # Superuser role in a throwaway container: the ledger suite applies its own
    # schema migration and creates a least-privilege app role for the write-guard
    # test, so it needs CREATE ROLE / CREATE EXTENSION on a disposable DB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: linknms_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/package-lock.json

      # `npm ci`, not `npm install`: Vercel deploys with `npm ci`, which fails
      # hard on a package.json/package-lock.json mismatch while `npm install`
      # silently repairs it. Using `npm install` here made CI structurally
      # incapable of catching lockfile drift — green checks, red deploy
      # (proven on PR #18, LINA-66). `--ignore-scripts` is a deliberate
      # supply-chain choice; keep it.
      - name: Install dependencies
        working-directory: services
        run: npm ci --ignore-scripts

      # The ledger reader now goes through the `ledger.project_audit` VIEW rather
      # than selecting ledger.audit_event directly (app roles hold no SELECT on
      # the table — LINA-56). That view is created by 0002_ledger_roles.sql and
      # granted to roles that db/roles.sql owns, so the suite can no longer get by
      # on applying 0001 to a bare database: the full platform migration has to
      # run first.
      - name: Apply all migrations
        env:
          MIGRATOR_DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: node db/migrate.mjs

      # Pure hash-chain core + Postgres adversarial suite (tamper/delete/forge/
      # reorder detected at exact seq, budget math, four-pillar status, audit
      # ETag/304, write-guard). Local PG speaks no TLS — the suite detects the
      # localhost target and connects without SSL (LINA-36 done criteria).
      - name: Run ledger tests
        working-directory: services
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: npm run test:ledger

  gateway-integration:
    name: API surface — mounted endpoints over Postgres
    runs-on: ubuntu-latest

    # The R0 acceptance walk (FR1–FR9) driven through the SAME handlers the Next
    # routes call, against a real database and — crucially — with each service
    # connected as its own least-privilege `<service>_app` role.
    #
    # This is the only job that can catch a missing GRANT. Every other suite runs
    # either in memory or as the table-owning migrator, which holds every
    # privilege and therefore cannot observe a missing one. LINA-37, LINA-51 and
    # LINA-56 each shipped a grant gap that unit tests could not see; three of
    # them were found by this suite on the day it was written.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: linknms_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/package-lock.json

      # For the live trust-invariant gate below: the checker is stack-agnostic
      # Python 3 (same one quality-gate.yml runs against the static fixture).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # See the ledger job: `npm ci` mirrors the Vercel deploy install exactly,
      # so lockfile drift fails here instead of at deploy time (LINA-66).
      - name: Install dependencies
        working-directory: services
        run: npm ci --ignore-scripts

      # Full platform migration: roles, the five service schemas, and every
      # per-service migration — including the grant matrix the suite asserts.
      - name: Apply all migrations
        env:
          MIGRATOR_DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: node db/migrate.mjs

      - name: Run mounted-surface integration tests
        working-directory: services
        env:
          # The suite connects as this login role and then SET ROLEs into each
          # `<service>_app` role, exactly as the deployed API does.
          VERIFY_DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
          DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: npm run test:gateway

      # LINA-64 — graduate the trust-invariant gate from fixture to LIVE data.
      # The exporter seeds the golden homeowner+GC build through the SAME mounted
      # handlers exercised above and reads it back over Postgres, normalising the
      # live field names to the checker's canonical shape (the fixture is left
      # untouched — run_gate.py's tamper mutators key off its field names). The
      # checker then runs against BOTH the live export AND the static fixture, so
      # the gate proves the real system upholds the invariants, not only the seed.
      # Budget math is the load-bearing one: `expected` is sourced from the live
      # ledger's status endpoint, so any drift between the CO projection and the
      # authoritative ledger total fails this step.
      - name: Export live golden record + run trust-invariant checker
        working-directory: services
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/linknms_ci
        run: |
          node gateway/export-live-record.mjs "$RUNNER_TEMP/live_record.json"
          echo "== checker against the LIVE export =="
          python3 ../qa/checks/audit_budget_invariants.py "$RUNNER_TEMP/live_record.json"
          echo "== checker against the static golden fixture (regression anchor) =="
          python3 ../qa/checks/audit_budget_invariants.py ../qa/fixtures/r0_shared_record.json

  analytics-tests:
    name: Analytics — event contract + composition root
    runs-on: ubuntu-latest

    # No database and no network: the suites run the real Identity / Decision /
    # Change Order services over in-memory ports and assert against a memory
    # sink. They are the Product Analytics Lead's LINA-28 acceptance gate
    # (8 Group-A events, project group, distinct_id == party_id, is_self_approval,
    # the no-PII guard) plus the LINA-58 composition root — analytics injected
    # into every service, and a flush before every response returns.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/package-lock.json

      # `npm ci` everywhere (LINA-66) — see the ledger job.
      - name: Install dependencies
        working-directory: services
        run: npm ci --ignore-scripts

      - name: Run analytics + composition tests
        working-directory: services
        run: npm run test:analytics

  openapi-lint:
    name: API v2 — contract lint
    runs-on: ubuntu-latest

    # Contract-first (to-be doc 11) is only real if the contract is held to in
    # CI: unique operationIds, declared path params, resolvable $refs, a
    # security default, and a Swagger embed that matches openapi.yaml. Stdlib
    # + PyYAML on purpose — a linter is no place for npm supply-chain surface.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint the /api/v2 contract
        run: |
          pip install pyyaml
          python3 scripts/openapi-lint.py

  platform-tests:
    name: Platform (v2) — outbox, ledger client, idempotency (Postgres)
    runs-on: ubuntu-latest

    # Phase-0 acceptance (to-be AGENT-INDEX §5): the ledger entry and the
    # outbox row commit in ONE transaction, proven against the real v2
    # migrations in a throwaway container.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: linknms_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      # `npm ci` — same lockfile-drift reasoning as every other job (LINA-66).
      - name: Install dependencies
        working-directory: platform
        run: npm ci --ignore-scripts

      # The suite creates its own throwaway database, so it connects to the
      # maintenance db as the container superuser.
      - name: Run platform tests
        working-directory: platform
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-1 acceptance (AGENT-INDEX §5): the doc-16 §5 matrix has tests,
      # and the identity store proves staffing + its ledger entry commit in
      # ONE transaction, against the same throwaway Postgres.
      - name: Install identity module dependencies
        working-directory: modules/identity
        run: npm ci --ignore-scripts

      - name: Run identity module tests
        working-directory: modules/identity
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-2 acceptance (AGENT-INDEX §5): the doc-09 project transition
      # table has tests, the http layer proves permission ∧ relationship ∧
      # staffing per operation, and the store proves every project write
      # ledgers in ONE transaction against the same throwaway Postgres.
      - name: Install project module dependencies
        working-directory: modules/project
        run: npm ci --ignore-scripts

      - name: Run project module tests
        working-directory: modules/project
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-3 acceptance (AGENT-INDEX §5): the doc-09 contract transition
      # table and the doc-04 V2/V3 projection have tests, the http layer
      # proves permission ∧ relationship ∧ staffing (incl. x-human-only
      # sign), and the store proves contract writes ledger + publish in ONE
      # transaction, one-live-prime (C3) and boq_freeze (§6.2) at DB level.
      - name: Install contracting module dependencies
        working-directory: modules/contracting
        run: npm ci --ignore-scripts

      - name: Run contracting module tests
        working-directory: modules/contracting
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-4 acceptance (AGENT-INDEX §5): the doc-05 link engine
      # (working-day propagation, rigid links, pins, summaries) and the D-33
      # scope are pure-domain tested; the http layer proves the D-26 delta
      # contract (LWW + base + overwrote + client_change_id replay); the
      # store proves plan writes ledger + publish in ONE serialized
      # transaction and the contract.signed consumer baselines idempotently.
      - name: Install planning module dependencies
        working-directory: modules/planning
        run: npm ci --ignore-scripts

      - name: Run planning module tests
        working-directory: modules/planning
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-5 acceptance (AGENT-INDEX §5): checks §8a/8b/8g/8h at API
      # level — verifier ≠ reporting org, only the raiser closes an NC,
      # proposer never decides a change order, measurements against the
      # live BoQ — and the stores prove money/quality writes ledger +
      # publish in ONE transaction against the same throwaway Postgres.
      - name: Install quality module dependencies
        working-directory: modules/quality
        run: npm ci --ignore-scripts

      - name: Run quality module tests
        working-directory: modules/quality
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

      # Phase-6 acceptance (AGENT-INDEX §5): lanes never enter planning
      # roll-ups (they live in tendering.* until signature) and bidders see
      # only their own lane — V8 proven in SQL; the award is ONE transaction
      # (RFP + lanes + contracting's contract draft, or nothing); the
      # winner's plan is copied + baselined only on contract.signed (D-36).
      - name: Install tendering module dependencies
        working-directory: modules/tendering
        run: npm ci --ignore-scripts

      - name: Run tendering module tests
        working-directory: modules/tendering
        env:
          DATABASE_URL: postgres://migrator:ci@localhost:5432/postgres
        run: npm test

  app-typecheck:
    name: App — typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci`, not `npm install`: it installs exactly the lockfile, which is
      # what the deploy target does. An `install` would paper over a dependency
      # that package.json declares but package-lock.json never resolved — the
      # failure mode that took the portal deploy down (`pg`).
      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Type-check
        working-directory: app
        run: npx tsc --noEmit

      # The typecheck alone cannot see a bundler failure: the API routes import
      # the services from OUTSIDE the Next root, so module resolution for the
      # server bundle is a real risk that only `next build` exercises. This job
      # is the guard that a green CI means a deployable app.
      - name: Build
        working-directory: app
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # The landing page had no CI job at all, which is how `18 / 50` shipped as a
  # hardcoded number and how the persona derivation could have shipped untested.
  # It is a real Next app on a real domain and it now gates like one.
  marketing-typecheck:
    name: Marketing site — typecheck & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20 like the jobs above: `node --test` only learned to expand
      # glob patterns itself in Node 21. On 20 the quoted `src/**/*.test.ts` is
      # passed through verbatim and the runner reports "could not find" — a green
      # local run on 22 and a red CI, for a reason that has nothing to do with
      # the code. 22 is also what Vercel builds this site with.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci`, not `npm install` — same reasoning as the app job above.
      - name: Install dependencies
        working-directory: marketing-site
        run: npm ci --ignore-scripts

      - name: Type-check
        working-directory: marketing-site
        run: npx tsc --noEmit

      # Covers the persona derivation (LINA-189): the rule that a plan overrides
      # a contradicting client-supplied persona is what keeps that column
      # trustworthy, and it is pure logic, so it is cheap to hold to it.
      - name: Run tests
        working-directory: marketing-site
        run: npm test
