openapi: 3.1.0
info:
  title: LinkNMS — Schedule & Progress API
  version: 0.1.0-r0
  description: >-
    The GC-owned construction plan and its progress (Slice 6, LINA-69; ADR-0005;
    r0-plan-progress-functional-spec §8; FR-P1, FR-P3–P6). The GC enters the plan
    as an ordered list of stages and reports progress on them; the homeowner reads
    everything and is denied every write (an authorization denial, never a 500 —
    spec §8.2).

    A stage's **current status is derived**, never stored: it is the status of the
    latest append-only progress entry, ordered by (reported_at, seq) — a total
    order (spec §8.1). Progress entries are never updated or deleted. Every
    transition is allowed; the one conditional is a correction back to
    `not_started`, which requires a note. Nothing but a GC report advances a stage
    — no date, no cascade, no change-order approval (spec §8.1).

    The plan rollup (headline · percent · current-stage pointer) is **derived on
    read**, equally weighted (count of `done` ÷ total), never cost- or
    duration-weighted (spec §8.3). Stage planned cost is free-form and can **never**
    move the authoritative budget: this service records no budget event and holds
    no grant to (spec §2 Q2, AC-P5/P12). The plan surface shows planned cost only
    as a read-only allocation hint against the baseline.

    The acting party is **server-derived** from the authenticated session
    (ADR-0004); it is never accepted in a request body. Money is signed integer
    cents.

    **Slice B1 plan import (LINA-199)**: the GC uploads a `.xlsx` workbook
    (multipart) and the server parses it — `:inspect` lists the sheets,
    `:columns` shows each source column's header + samples, `:preview` builds the
    two-level WBS tree (Action row / Sub-action row) with validation problems
    returned *in the 200 payload*, and `:confirm` writes the whole batch in ONE
    transaction behind a single `plan_import` audit event, idempotent on
    `idempotencyKey`. Nothing is inferred from the file — the GC's `mapping`
    names the source columns; required fields (`action`, `start`, `end`) unmapped
    is a 400.
servers:
  - url: /api
    description: R0 single-instance gateway (services share one Postgres, one schema each)

tags:
  - name: schedule
    description: The plan timeline, stages, and append-only progress.
  - name: plan-import
    description: >-
      Slice B1 (LINA-199) — the GC imports a plan from an `.xlsx` workbook. Read
      the file with `:inspect`/`:columns`/`:preview` (no writes), then commit it
      with `:confirm` (exactly one transaction).

paths:
  /projects/{projectId}/plan:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [schedule]
      summary: The plan timeline + derived rollup (FR-P4, FR-P6)
      description: >-
        Ordered stages with each stage's current derived status and advisory
        percent, plus the plan headline, percent complete, current-stage pointer,
        and the read-only allocated-vs-baseline hint. Readable by both parties.
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/stages:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [schedule]
      summary: Add a stage to the plan (FR-P1) — GC only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StageCreate' }
      responses:
        '201':
          description: The created stage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stages/{stageId}:
    parameters:
      - $ref: '#/components/parameters/StageId'
    get:
      tags: [schedule]
      summary: One stage + its full attributed progress history (FR-P3, AC-P3)
      responses:
        '200':
          description: The stage with history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [schedule]
      summary: Edit or reorder a stage (FR-P1) — GC only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StagePatch' }
      responses:
        '200':
          description: The updated stage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stages/{stageId}/progress:
    parameters:
      - $ref: '#/components/parameters/StageId'
    post:
      tags: [schedule]
      summary: Append a progress report (FR-P3, spec §8.1) — GC only
      description: >-
        Appends a new attributed, time-stamped entry. Every transition is allowed;
        a correction back to `not_started` requires a note (400 `note_required`
        otherwise). `percent` is advisory and only stored while `in_progress`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressReport' }
      responses:
        '201':
          description: The stage with the new report reflected as current.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/plan-imports:inspect:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [plan-import]
      summary: List the workbook's sheets (LINA-199 D8) — GC only, no writes
      description: >-
        Reads the uploaded `.xlsx` (extension + size + archive are validated
        server-side) and reports every sheet with its data-row count so the GC can
        pick one. The server NEVER auto-picks a sheet.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/FileUpload' }
      responses:
        '200':
          description: The sheets, plus the import limits the app should echo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/plan-imports:columns:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [plan-import]
      summary: Inspect source columns of one sheet (LINA-199 D9) — GC only, no writes
      description: >-
        Header + up to three sample values per source column, so the GC can build
        the field→column `mapping`. No writes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SheetUpload' }
      responses:
        '200':
          description: The source columns and the data-row count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColumnsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/plan-imports:preview:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [plan-import]
      summary: Build the two-level WBS tree (LINA-199 D9→D10) — GC only, no writes
      description: >-
        Applies the GC's `mapping` server-side and returns the WBS tree (Action
        rows as roots, Sub-action rows as children). Data-quality problems are
        returned IN THE 200 PAYLOAD as `errors[]` — never a 500 and never a modal
        bomb; `:confirm` refuses to commit a tree with errors.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MappingUpload' }
      responses:
        '200':
          description: The WBS tree, warnings, errors and import stats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/plan-imports:confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [plan-import]
      summary: Commit the plan (LINA-199 D10) — GC only, the single write
      description: >-
        Re-parses the re-sent file server-side (the preview the client rendered is
        never trusted as the write payload), then writes the whole batch in ONE
        transaction: a single `plan_import` audit event, the import header, the
        proposal the import seeds (`plan_version` v1 proposed +
        `plan_proposed` audit event + the importer's authorship stamp, per the B2
        contract §4 "import-seed" half), the stage rows bound to that version
        (parents before children, positions appended after any hand-added stages)
        and the intra-import predecessor links. The seeded D11 proposal is served
        by `GET /plan` as `current`. Idempotent on `idempotencyKey`: a serverless
        retry with a used key writes nothing and returns the ORIGINAL
        `importId`/`auditEventId`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ConfirmUpload' }
      responses:
        '201':
          description: The committed import.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StageId:
      name: stageId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid input.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: No acting party in session.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: The acting party may not perform this action (e.g. a homeowner write).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: The stage does not exist.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Status:
      type: string
      enum: [not_started, in_progress, blocked, done]
    Headline:
      description: >-
        The plan headline (spec §8.3 R1). `null` means the empty state (zero
        stages) — render "your GC hasn't added the plan yet", never "0%".
      type: [string, 'null']
      enum: [attention_needed, complete, in_progress, not_started, null]
    StageCreate:
      type: object
      required: [name, position]
      properties:
        name: { type: string }
        position: { type: integer, description: Plan order (not dates). }
        scopeNote: { type: [string, 'null'] }
        plannedStartDate: { type: [string, 'null'], format: date }
        plannedEndDate: { type: [string, 'null'], format: date }
        plannedCostCents:
          type: [integer, 'null']
          description: Free-form; NEVER moves the budget (spec §2 Q2).
    StagePatch:
      type: object
      description: Any subset of the editable fields; at least one required.
      properties:
        name: { type: string }
        position: { type: integer }
        scopeNote: { type: [string, 'null'] }
        plannedStartDate: { type: [string, 'null'], format: date }
        plannedEndDate: { type: [string, 'null'], format: date }
        plannedCostCents: { type: [integer, 'null'] }
    ProgressReport:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/Status' }
        percent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Advisory; ignored unless status is in_progress (spec §2 Q1).
        note:
          type: [string, 'null']
          description: Required when correcting a stage back to not_started (spec §8.1).
    ProgressEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        percent: { type: [integer, 'null'] }
        note: { type: [string, 'null'] }
        reportedBy: { type: string, format: uuid }
        reportedAt: { type: string, format: date-time }
    Stage:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        scopeNote: { type: [string, 'null'] }
        plannedStartDate: { type: [string, 'null'], format: date }
        plannedEndDate: { type: [string, 'null'], format: date }
        plannedCostCents: { type: [integer, 'null'] }
        currentStatus: { $ref: '#/components/schemas/Status' }
        currentPercent:
          type: [integer, 'null']
          description: The advisory percent, only present while in_progress.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        history:
          type: array
          description: Full attributed history, oldest→newest (present on single-stage reads).
          items: { $ref: '#/components/schemas/ProgressEntry' }
    Allocation:
      type: object
      description: Read-only allocation hint (FR-P6). NOT the budget; cannot move it.
      properties:
        allocatedCents: { type: integer, description: Sum of planned stage costs. }
        baselineCents: { type: integer, description: The ledger's authoritative baseline. }
        deltaCents: { type: integer, description: allocatedCents − baselineCents (informational). }
    Plan:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        headline: { $ref: '#/components/schemas/Headline' }
        percentComplete:
          type: [integer, 'null']
          description: Equal-weighted done÷total, floored; null when zero stages (spec §8.3 R2).
        currentStageId: { type: [string, 'null'], format: uuid }
        totalStages: { type: integer }
        doneStages: { type: integer }
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }
        allocation: { $ref: '#/components/schemas/Allocation' }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              description: >-
                Optional machine-readable detail (e.g. `errors[]` from a refused
                plan-import `:confirm`). Present only when a 4xx carries one.
              type: object

    # ── Slice B1 plan import (LINA-199) ─────────────────────────────────────

    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The `.xlsx` workbook. Max 5&nbsp;MB, up to 100 sheets.
    SheetUpload:
      description: 'The `.xlsx` upload plus the sheet the GC selected.'
      type: object
      required: [file, sheet]
      properties:
        file: { type: string, format: binary }
        sheet: { type: string }
    MappingUpload:
      description: >-
        `.xlsx` + sheet + the GC's field→column mapping. JSON-encode `mapping`
        into the multipart field.
      type: object
      required: [file, sheet, mapping]
      properties:
        file: { type: string, format: binary }
        sheet: { type: string }
        mapping:
          type: string
          description: JSON object of field→column index, e.g. {"action":1}.
    ConfirmUpload:
      description: >-
        Like `MappingUpload` plus an idempotency key. The GC re-sends the SAME
        file the preview rendered — the server re-parses it and never trusts the
        preview as the write payload.
      type: object
      required: [file, sheet, mapping, idempotencyKey]
      properties:
        file: { type: string, format: binary }
        sheet: { type: string }
        mapping: { type: string, description: JSON object of field→column index. }
        idempotencyKey:
          type: string
          maxLength: 200
          description: Required; a serverless retry with a used key is a no-op replay.
    ImportLimits:
      type: object
      description: The server-side limits the app should echo to the GC.
      properties:
        maxFileBytes: { type: integer }
        maxSheets: { type: integer }
        maxRows: { type: integer }
        maxCols: { type: integer }
        maxDependencies: { type: integer }
        acceptedExtensions:
          type: array
          items: { type: string }
    SheetInfo:
      type: object
      properties:
        name: { type: string }
        rowCount: { type: integer, description: Data rows below the header row. }
    ColumnInfo:
      type: object
      properties:
        index: { type: integer, description: 1-based source column. }
        header: { type: string }
        sampleValues: { type: array, items: { type: string }, description: Up to 3. }
    InspectResult:
      type: object
      properties:
        sheets: { type: array, items: { $ref: '#/components/schemas/SheetInfo' } }
        limits: { $ref: '#/components/schemas/ImportLimits' }
    ColumnsResult:
      type: object
      properties:
        columns: { type: array, items: { $ref: '#/components/schemas/ColumnInfo' } }
        rowCount: { type: integer }
        limits: { $ref: '#/components/schemas/ImportLimits' }
    WBSNode:
      description: >-
        One stage in the imported WBS. Exactly two levels: a root has
        `subActionOf` null and `children[]`; a sub-action carries `subActionOf`
        and no children. `ref` is the sheet row it came from (R{row}); a
        dependency token is a `ref` of the same import.
      type: object
      required: [ref, action, subActionOf, start, end, trade, dependsOn, children]
      properties:
        ref: { type: string, description: 'Sheet ref, e.g. R4 (sheet row 4).' }
        action: { type: string, description: The stage name (sub-action name for a child). }
        subActionOf: { type: [string, 'null'], description: The parent root's ref, or null. }
        start: { type: [string, 'null'], format: date }
        end: { type: [string, 'null'], format: date }
        trade: { type: [string, 'null'] }
        dependsOn: { type: array, items: { type: string }, description: refs in the same import. }
        children: { type: array, items: { $ref: '#/components/schemas/WBSNode' } }
    PreviewStats:
      type: object
      properties:
        stageCount: { type: integer }
        rootCount: { type: integer }
        subActionCount: { type: integer }
    PreviewResult:
      type: object
      properties:
        roots:
          type: array
          items: { $ref: '#/components/schemas/WBSNode' }
        warnings: { type: array, items: { type: string } }
        errors:
          type: array
          items: { type: string }
          description: Data-quality problems. A non-empty list blocks :confirm.
        stats: { $ref: '#/components/schemas/PreviewStats' }
    ConfirmResult:
      type: object
      properties:
        importId: { type: string, format: uuid }
        auditEventId: { type: string, format: uuid, description: The one plan_import audit event for the batch. }
        stageCount: { type: integer }
        rootCount: { type: integer }
