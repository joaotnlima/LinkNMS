openapi: 3.1.0
info:
  title: LinkNMS — Schedule & Progress API
  version: 0.1.0-r0
  description: >-
    The GC-owned construction plan and its progress (Slice 6, LINA-69; ADR-0005;
    r0-plan-progress-functional-spec §8; FR-P1, FR-P3–P6). The GC enters the plan
    as an ordered list of stages and reports progress on them; the homeowner reads
    everything and is denied every write (an authorization denial, never a 500 —
    spec §8.2).

    A stage's **current status is derived**, never stored: it is the status of the
    latest append-only progress entry, ordered by (reported_at, seq) — a total
    order (spec §8.1). Progress entries are never updated or deleted. Every
    transition is allowed; the one conditional is a correction back to
    `not_started`, which requires a note. Nothing but a GC report advances a stage
    — no date, no cascade, no change-order approval (spec §8.1).

    The plan rollup (headline · percent · current-stage pointer) is **derived on
    read**, equally weighted (count of `done` ÷ total), never cost- or
    duration-weighted (spec §8.3). Stage planned cost is free-form and can **never**
    move the authoritative budget: this service records no budget event and holds
    no grant to (spec §2 Q2, AC-P5/P12). The plan surface shows planned cost only
    as a read-only allocation hint against the baseline.

    The acting party is **server-derived** from the authenticated session
    (ADR-0004); it is never accepted in a request body. Money is signed integer
    cents.

    **Slice B1 plan import (LINA-199)**: the GC uploads a `.xlsx` workbook
    (multipart) and the server parses it — `:inspect` lists the sheets,
    `:columns` shows each source column's header + samples, `:preview` builds the
    two-level WBS tree (Action row / Sub-action row) with validation problems
    returned *in the 200 payload*, and `:confirm` writes the whole batch in ONE
    transaction behind a single `plan_import` audit event, idempotent on
    `idempotencyKey`. Nothing is inferred from the file — the GC's `mapping`
    names the source columns; required fields (`action`, `start`, `end`) unmapped
    is a 400.
servers:
  - url: /api
    description: R0 single-instance gateway (services share one Postgres, one schema each)

tags:
  - name: schedule
    description: The plan timeline, stages, and append-only progress.
  - name: plan-import
    description: >-
      Slice B1 (LINA-199) — the GC imports a plan from an `.xlsx` workbook. Read
      the file with `:inspect`/`:columns`/`:preview` (no writes), then commit it
      with `:confirm` (exactly one transaction).

paths:
  /projects/{projectId}/plan:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [schedule]
      summary: The plan timeline + derived rollup (FR-P4, FR-P6)
      description: >-
        Ordered stages with each stage's current derived status and advisory
        percent, plus the plan headline, percent complete, current-stage pointer,
        and the read-only allocated-vs-baseline hint. Readable by both parties.
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/stages:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [schedule]
      summary: Add a stage to the plan (FR-P1) — GC only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StageCreate' }
      responses:
        '201':
          description: The created stage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stages/{stageId}:
    parameters:
      - $ref: '#/components/parameters/StageId'
    get:
      tags: [schedule]
      summary: One stage + its full attributed progress history (FR-P3, AC-P3)
      responses:
        '200':
          description: The stage with history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [schedule]
      summary: Edit or reorder a stage (FR-P1) — GC only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StagePatch' }
      responses:
        '200':
          description: The updated stage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stages/{stageId}/progress:
    parameters:
      - $ref: '#/components/parameters/StageId'
    post:
      tags: [schedule]
      summary: Append a progress report (FR-P3, spec §8.1) — GC only
      description: >-
        Appends a new attributed, time-stamped entry. Every transition is allowed;
        a correction back to `not_started` requires a note (400 `note_required`
        otherwise). `percent` is advisory and only stored while `in_progress`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressReport' }
      responses:
        '201':
          description: The stage with the new report reflected as current.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/plan-imports:inspect:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [plan-import]
      summary: List the workbook's sheets (LINA-199 D8) — GC only, no writes
      description: >-
        Reads the uploaded `.xlsx` (extension + size + archive are validated
        server-side) and reports every sheet with its data-row count so the GC can
        pick one. The server NEVER auto-picks a sheet.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/FileUpload' }
      responses:
        '200':
          description: The sheets, plus the import limits the app should echo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/plan-imports:columns:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [plan-import]
      summary: Inspect source columns of one sheet (LINA-199 D9) — GC only, no writes
      description: >-
        Header + up to three sample values per source column, so the GC can build
        the field→column `mapping`. No writes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SheetUpload' }
      responses:
        '200':
          description: The source columns and the data-row count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColumnsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/plan-imports:preview:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [plan-import]
      summary: Build the two-level WBS tree (LINA-199 D9→D10) — GC only, no writes
      description: >-
        Applies the GC's `mapping` server-side and returns the WBS tree (Action
        rows as roots, Sub-action rows as children). Data-quality problems are
        returned IN THE 200 PAYLOAD as `errors[]` — never a 500 and never a modal
        bomb; `:confirm` refuses to commit a tree with errors.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MappingUpload' }
      responses:
        '200':
          description: The WBS tree, warnings, errors and import stats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/plan-imports:confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [plan-import]
      summary: Commit the plan (LINA-199 D10) — GC only, the single write
      description: >-
        Re-parses the re-sent file server-side (the preview the client rendered is
        never trusted as the write payload), then writes the whole batch in ONE
        transaction: a single `plan_import` audit event, the import header, the
        proposal the import seeds (`plan_version` v1 proposed +
        `plan_proposed` audit event + the importer's authorship stamp, per the B2
        contract §4 "import-seed" half), the stage rows bound to that version
        (parents before children, positions appended after any hand-added stages)
        and the intra-import predecessor links. The seeded D11 proposal is served
        by `GET /plan` as `current`. Idempotent on `idempotencyKey`: a serverless
        retry with a used key writes nothing and returns the ORIGINAL
        `importId`/`auditEventId`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ConfirmUpload' }
      responses:
        '201':
          description: The committed import.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Slice LINA-249 task workspace (per-stage comments & attachments) ───────

  /projects/{projectId}/plan/stages/{stageKey}/workspace:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/StageKey'
    get:
      tags: [schedule]
      summary: Task workspace (LINA-249) — one fetch of comments + attachments
      description: >-
        The comment thread and file list for one task, keyed by the stable
        client-minted `stage.key` (not the stage row id, which re-mints per save).
        Oldest → newest on both rails. Readable by any project member.
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/plan/stages/{stageKey}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/StageKey'
    post:
      tags: [schedule]
      summary: Append a task comment (LINA-249) — any project member
      description: >-
        Appends one comment to the stage's thread. Author is the session party
        (ADR-0004); a body-supplied author is ignored. Append-only: no edit or
        delete (the table grants SELECT + INSERT only). Not a ledger event —
        comments are chatter, not agreement change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StageCommentCreate' }
      responses:
        '201':
          description: The created comment.
          content:
            application/json:
              schema:
                type: object
                required: [comment]
                properties:
                  comment: { $ref: '#/components/schemas/StageComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/plan/stages/{stageKey}/attachments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/StageKey'
    post:
      tags: [schedule]
      summary: Upload a task attachment (LINA-249) — any project member
      description: >-
        Uploads one file (multipart `$file` part) to Vercel Blob and records the
        row. Content type is sniffed server-side from magic bytes (allowlist:
        images + pdf + office docs); browser-declared types are never trusted.
        10 MB cap (413). Uploader is the session party; a client-supplied
        uploader is ignored. Append-only.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The created attachment row (blob URL + server metadata).
          content:
            application/json:
              schema:
                type: object
                required: [attachment]
                properties:
                  attachment: { $ref: '#/components/schemas/StageAttachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/AttachmentTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  # ── Slice B3 live record + materials + budget movement (LINA-217) ───────────

  /projects/{projectId}/record:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [schedule]
      summary: The live record (B3 D14, contract §3a) — derived states + 4 tabs
      description: >-
        The 4-tab projection over the baseline plan + materials + movements +
        budget + audit read: plan lines with derived line state and Compare,
        schedule (planned vs executed), the money breakdown (D16 MoneyView), and
        the project's hash-chained ledger history. `state` is a whole-record
        rollup of per-line states — a line is `deviation` when a movement has
        touched it; `closed_and_verified` is deferred in v1 (contract §7). Read
        by any seated party.
      responses:
        '200':
          description: The live record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stages/{stageId}/materials:
    parameters:
      - $ref: '#/components/parameters/StageId'
    get:
      tags: [schedule]
      summary: The materials + movements behind a line (B3 D15, contract §3b r2)
      description: >-
        Each material/labour behind the stage's price, rendered at its CURRENT
        state (baseline overridden by the latest movement), plus every movement
        row that produced it. Read by any seated party.
      responses:
        '200':
          description: The line materials + movements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineMaterials' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [schedule]
      summary: Author the materials behind a line (B3 D15, contract §3b r3) — proposer, proposed only
      description: >-
        Full-replaces the stage's materials. Allowed only while the stage's plan
        version is `proposed` and only for the proposing party (PROPOSE_PLAN);
        the DB freeze trigger is the backstop. Once frozen, materials move only by
        swap (route 4) — never by re-authoring.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaterialAuthor' }
      responses:
        '201':
          description: The authored materials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineMaterials' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Forbidden' }

  /stages/{stageId}/materials:swap:
    parameters:
      - $ref: '#/components/parameters/StageId'
    post:
      tags: [schedule]
      summary: Record a post-baseline material movement (B3 D15/D16, contract §3b r4) — GC
      description: >-
        The ONLY way a frozen line changes. `valueDeltaCents = newExtended −
        priorExtended` is computed server-side. `scope_change` opens a change
        order (cost delta = valueDelta, server-derived) via the change_order
        service, then writes the linked movement + `material_movement_recorded`
        ledger event; the CO carries its own two-sided approval to actually move
        the budget. `price_movement` writes the movement + ledger event only — no
        CO, no budget move. The material row stays frozen (ADR-0014 §1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwapInput' }
      responses:
        '201':
          description: The movement (and, for a scope change, the opened change order).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwapResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/budget-movement:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [schedule]
      summary: The MoneyView (B3 D16, contract §3c route 5)
      description: >-
        Two structurally separate arrays — `scopeChanges` (each an approved or
        pending change order; they moved the contract total) vs `priceMovements`
        (recorded, sourced, attributable; they did NOT move the contract total,
        shown against the baseline unit price). They are never summed together.
        `currentBudgetCents` is read from the ledger, never recomputed. Read by
        any seated party.
      responses:
        '200':
          description: The MoneyView.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoneyView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/plan-template:
    get:
      tags: [schedule]
      summary: Resolve the caller's default plan scaffold (LINA-241, ADR-0018)
      description: >-
        The applicable default plan body for the authenticated caller, resolved
        via the ladder user default → system default (org deferred in v1). A
        template is a names-only scaffold with NO audit weight — `seedSkeleton()`
        copies `body` into a fresh editor draft; nothing here touches a project,
        stage, version, or the ledger. Per-user and project-independent, so it
        lives under `/me`, not `/projects/{id}`. The acting party is the session.
      responses:
        '200':
          description: The resolved default template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTemplateResolved' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      tags: [schedule]
      summary: Save the caller's single "my default" plan template
      description: >-
        Upsert the caller's one `user` default from a posted names-only body
        (`[{ name, tasks: [name, …] }]`). A second save REPLACES the first — the
        partial unique index guarantees one default per user, never a 2nd.
        `owner_id` is stamped from the session, so a forged owner in the body is
        inert (ADR-0004). The body is validated at the edge: dates, owners, and a
        3rd level are rejected, not silently dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanTemplateUpsert' }
      responses:
        '200':
          description: The saved default template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTemplateResolved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ── RFP procurement loop (LINA-279, ADR-0023, ratified LINA-294) ────────────
  # The procurement phase lets the owner/GC broadcast a request for proposals to
  # external, UNAUTHENTICATED contractors. Authenticated routes gate on
  # MANAGE_RFP / VIEW_RFP (owner + counterparty; subcontractor is a typed 403).
  # The token routes need NO session — the token IS the credential
  # (ADR-0023 §5). The token ladder (ratified LINA-294) is:
  #
  #   GET preview:  unknown / declined → 404; submitted → 200-with-proposal;
  #                 phase not active → 410; else 200 (invited→viewed).
  #   POST submit:  404 → 409 already_submitted → 410 → 400 invalid_proposal
  #                 → 400 too_many_images → 201 (proposal + recipient submitted).
  #   POST upload:  404 → 409 → 410 → sniff/size → 201 FileRef.
  #
  # send() fails closed (503) before minting when email is unconfigured
  # (ADR-0007 §5). Draft-era delete of a recipient (migration 0013) is
  # delegated to the schedule_app.

  /projects/{projectId}/procurement:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [schedule]
      summary: The full procurement view for a project (LINA-279, ADR-0023)
      description: >-
        VIEW_RFP required. A fresh (never-saved) project returns the empty view.
        A project the actor cannot reach is a typed 403 (never a probe).
        phase.status is derived from the actual procurement-phase row.
      responses:
        '200':
          description: The procurement view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/procurement/rfp:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      tags: [schedule]
      summary: Upsert the live RFP draft (LINA-279, ADR-0023)
      description: >-
        MANAGE_RFP required. One live (draft or sent) RFP per procurement
        phase — PUT creates on the first call and overwrites on subsequent
        calls. specialty tags are trimmed, deduplicated, and capped at 20 × 100
        chars. A blank description (all whitespace) is rejected. Once sent the
        draft is sealed: 409 rfp_already_sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RfpSaveBody' }
      responses:
        '200':
          description: The saved RFP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rfp: { $ref: '#/components/schemas/RfpView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/procurement/rfp/attachments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [schedule]
      summary: Append one attachment to the live RFP draft (LINA-279)
      description: >-
        MANAGE_RFP required. One-file multipart; the upload seam sniffs
        the content type (JPEG, PNG, WebP, HEIC only) and enforces a 10 MB
        cap. Auto-creates a draft if none exists. Appended, never replaced.
        409 once the RFP has been sent.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: The stored FileRef.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment: { $ref: '#/components/schemas/FileRef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: The file exceeds the 10 MB cap.
        '415':
          description: The file content type is not a supported image.

  /projects/{projectId}/procurement/rfp/recipients:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [schedule]
      summary: Add invitee emails to the live RFP (LINA-279, ADR-0023)
      description: >-
        MANAGE_RFP required. Accepts a flat `emails` array; normalises (trim +
        lowercase), deduplicates, and mints a SHA-256 token hash per new email.
        The raw token is never returned — send() rotates the hash when it mints
        the delivered link. Duplicate emails against the same RFP are a silent
        no-op (no `duplicate_recipient` event; the DB UNIQUE (rfp_id, email) is
        the backstop). Auto-creates a draft if none exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RfpRecipientsInput' }
      responses:
        '200':
          description: The full, deduplicated recipient list (no raw tokens).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RfpRecipientsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/procurement/rfp/recipients/{recipientId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: recipientId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [schedule]
      summary: Remove a draft-era invitee (LINA-279, ADR-0023)
      description: >-
        MANAGE_RFP required. Draft-only (migration 0013 delegated the
        schedule.rfp_recipient DELETE grant to schedule_app exactly for this).
        Once the RFP has been sent this is a 409 rfp_already_sent.
      responses:
        '204':
          description: The recipient was removed.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/rfp:send:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [schedule]
      summary: Email a unique proposal link to every invitee (LINA-279, ADR-0023)
      description: >-
        MANAGE_RFP required. draft → sent, once; re-send is allowed from `sent`
        to re-mail pending invitees. Each mail-out mints a FRESH raw token per
        recipient (rotating the stored hash) so the deliverable link exists only
        in the outgoing email — never in a response, log, or the DB — and a
        re-send defeats anyone replaying a captured link. The link is derived
        from the request's forwarded origin (never the body). Fail-closed: if
        email is unconfigured this is a 503 email_unconfigured and NOTHING is
        minted (ADR-0007 §5). Returns the full procurement view.
      responses:
        '200':
          description: The refreshed procurement view (draft→sent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: Email delivery is not configured (fail-closed; nothing minted).

  /rfp/token/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: >-
          The raw base64url token from the emailed link. SHA-256'd and compared
          to the stored hash — never treated as a record id. The token IS the
          credential; no session is read.
        schema: { type: string }
    get:
      tags: [schedule]
      summary: Public RFP preview — the proposal form's initial load (LINA-294)
      description: >-
        NO session. The token ladder: unknown / declined → 404 not_found;
        submitted → 200 WITH the proposal (checked BEFORE the phase gate so the
        confirmation page can re-read post-close); phase not active → 410
        rfp_closed; else 200 { proposal: null } and the recipient flips
        invited→viewed. The raw token is never echoed.
      responses:
        '200':
          description: The project, RFP, and (if spent) the proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPreview' }
        '404':
          description: Unknown token or declined recipient (uniform; never probes).
        '410':
          description: The procurement phase is no longer active.

  /rfp/token/{token}/portfolio-images:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [schedule]
      summary: Upload a portfolio image behind the proposal form (LINA-294)
      description: >-
        NO session. Token ladder: 404 → 409 already_submitted → 410 rfp_closed →
        sniff/size validation → 201 FileRef. JPEG, PNG, WebP and HEIC (ISO-BMFF
        ftyp brand check) accepted; GIF and others → 415; empty → 400; >10 MB →
        413. Nothing lands on the draft — the FileRef is held by the FE until
        submit().
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: The stored FileRef.
          content:
            application/json:
              schema:
                type: object
                properties:
                  image: { $ref: '#/components/schemas/FileRef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: The procurement phase is no longer active.
        '413':
          description: The file exceeds the 10 MB cap.
        '415':
          description: The file content type is not a supported image.

  /rfp/token/{token}/proposal:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [schedule]
      summary: Submit a proposal as an external, unauthenticated contractor (LINA-294)
      description: >-
        NO session. Token ladder: 404 → 409 already_submitted → 410 rfp_closed →
        400 invalid_proposal (companyName required ≤200; websiteUrl http(s) +
        dotted hostname; budget int cents ≥0 with max≥min; timelineDays
        positive int ≤3650; comment optional ≤4000) → 400 too_many_images (>8)
        → 201 { proposal }. The proposal INSERT and the recipient submitted-stamp
        commit in ONE transaction. Append-only: ONE proposal per recipient,
        never edited or deleted. token ProposalView is id-less.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposalSubmit' }
      responses:
        '201':
          description: The submitted proposal (token view; no id).
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: { $ref: '#/components/schemas/Proposal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown token or declined recipient.
        '409':
          description: Token already spent (already_submitted).

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StageId:
      name: stageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StageKey:
      name: stageKey
      in: path
      required: true
      description: >-
        The stable client-minted task key (schedule.stage.key, LINA-249). Not a
        UUID; ≤ 200 chars.
      schema: { type: string, minLength: 1, maxLength: 200 }
    PhaseId:
      name: phaseId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid input.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: No acting party in session.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: The acting party may not perform this action (e.g. a homeowner write).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: The stage does not exist.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: The request conflicts with current state (no double-live RFP, duplicate recipient, spent token, immutable in-flight row).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    AttachmentTooLarge:
      description: File exceeds the 10 MB cap (LINA-249).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnsupportedMediaType:
      description: File type is not on the allowlist (images + pdf + office docs, LINA-249).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Status:
      type: string
      enum: [not_started, in_progress, blocked, done]
    Headline:
      description: >-
        The plan headline (spec §8.3 R1). `null` means the empty state (zero
        stages) — render "your GC hasn't added the plan yet", never "0%".
      type: [string, 'null']
      enum: [attention_needed, complete, in_progress, not_started, null]
    StageCreate:
      type: object
      required: [name, position]
      properties:
        name: { type: string }
        position: { type: integer, description: Plan order (not dates). }
        scopeNote: { type: [string, 'null'] }
        description:
          type: [string, 'null']
          description: Free-form task body shown in the task-detail drawer (≤ 4000 chars, LINA-234).
        plannedStartDate: { type: [string, 'null'], format: date }
        plannedEndDate: { type: [string, 'null'], format: date }
        plannedCostCents:
          type: [integer, 'null']
          description: Free-form; NEVER moves the budget (spec §2 Q2).
    StagePatch:
      type: object
      description: Any subset of the editable fields; at least one required.
      properties:
        name: { type: string }
        position: { type: integer }
        scopeNote: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        plannedStartDate: { type: [string, 'null'], format: date }
        plannedEndDate: { type: [string, 'null'], format: date }
        plannedCostCents: { type: [integer, 'null'] }
    ProgressReport:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/Status' }
        percent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Advisory; ignored unless status is in_progress (spec §2 Q1).
        note:
          type: [string, 'null']
          description: Required when correcting a stage back to not_started (spec §8.1).
    ProgressEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        percent: { type: [integer, 'null'] }
        note: { type: [string, 'null'] }
        reportedBy: { type: string, format: uuid }
        reportedAt: { type: string, format: date-time }
    Stage:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        scopeNote: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        plannedStartDate: { type: [string, 'null'], format: date }
        plannedEndDate: { type: [string, 'null'], format: date }
        plannedCostCents: { type: [integer, 'null'] }
        currentStatus: { $ref: '#/components/schemas/Status' }
        currentPercent:
          type: [integer, 'null']
          description: The advisory percent, only present while in_progress.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        history:
          type: array
          description: Full attributed history, oldest→newest (present on single-stage reads).
          items: { $ref: '#/components/schemas/ProgressEntry' }
    Allocation:
      type: object
      description: Read-only allocation hint (FR-P6). NOT the budget; cannot move it.
      properties:
        allocatedCents: { type: integer, description: Sum of planned stage costs. }
        baselineCents: { type: integer, description: The ledger's authoritative baseline. }
        deltaCents: { type: integer, description: allocatedCents − baselineCents (informational). }
    Plan:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        headline: { $ref: '#/components/schemas/Headline' }
        percentComplete:
          type: [integer, 'null']
          description: Equal-weighted done÷total, floored; null when zero stages (spec §8.3 R2).
        currentStageId: { type: [string, 'null'], format: uuid }
        totalStages: { type: integer }
        doneStages: { type: integer }
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }
        allocation: { $ref: '#/components/schemas/Allocation' }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              description: >-
                Optional machine-readable detail (e.g. `errors[]` from a refused
                plan-import `:confirm`). Present only when a 4xx carries one.
              type: object

    # ── Slice B1 plan import (LINA-199) ─────────────────────────────────────

    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The `.xlsx` workbook. Max 5&nbsp;MB, up to 100 sheets.
    SheetUpload:
      description: 'The `.xlsx` upload plus the sheet the GC selected.'
      type: object
      required: [file, sheet]
      properties:
        file: { type: string, format: binary }
        sheet: { type: string }
    MappingUpload:
      description: >-
        `.xlsx` + sheet + the GC's field→column mapping. JSON-encode `mapping`
        into the multipart field.
      type: object
      required: [file, sheet, mapping]
      properties:
        file: { type: string, format: binary }
        sheet: { type: string }
        mapping:
          type: string
          description: JSON object of field→column index, e.g. {"action":1}.
    ConfirmUpload:
      description: >-
        Like `MappingUpload` plus an idempotency key. The GC re-sends the SAME
        file the preview rendered — the server re-parses it and never trusts the
        preview as the write payload.
      type: object
      required: [file, sheet, mapping, idempotencyKey]
      properties:
        file: { type: string, format: binary }
        sheet: { type: string }
        mapping: { type: string, description: JSON object of field→column index. }
        idempotencyKey:
          type: string
          maxLength: 200
          description: Required; a serverless retry with a used key is a no-op replay.
    ImportLimits:
      type: object
      description: The server-side limits the app should echo to the GC.
      properties:
        maxFileBytes: { type: integer }
        maxSheets: { type: integer }
        maxRows: { type: integer }
        maxCols: { type: integer }
        maxDependencies: { type: integer }
        acceptedExtensions:
          type: array
          items: { type: string }
    SheetInfo:
      type: object
      properties:
        name: { type: string }
        rowCount: { type: integer, description: Data rows below the header row. }
    ColumnInfo:
      type: object
      properties:
        index: { type: integer, description: 1-based source column. }
        header: { type: string }
        sampleValues: { type: array, items: { type: string }, description: Up to 3. }
    InspectResult:
      type: object
      properties:
        sheets: { type: array, items: { $ref: '#/components/schemas/SheetInfo' } }
        limits: { $ref: '#/components/schemas/ImportLimits' }
    ColumnsResult:
      type: object
      properties:
        columns: { type: array, items: { $ref: '#/components/schemas/ColumnInfo' } }
        rowCount: { type: integer }
        limits: { $ref: '#/components/schemas/ImportLimits' }
    WBSNode:
      description: >-
        One stage in the imported WBS. Exactly two levels: a root has
        `subActionOf` null and `children[]`; a sub-action carries `subActionOf`
        and no children. `ref` is the sheet row it came from (R{row}); a
        dependency token is a `ref` of the same import.
      type: object
      required: [ref, action, subActionOf, start, end, trade, dependsOn, children]
      properties:
        ref: { type: string, description: 'Sheet ref, e.g. R4 (sheet row 4).' }
        action: { type: string, description: The stage name (sub-action name for a child). }
        subActionOf: { type: [string, 'null'], description: The parent root's ref, or null. }
        start: { type: [string, 'null'], format: date }
        end: { type: [string, 'null'], format: date }
        trade: { type: [string, 'null'] }
        dependsOn: { type: array, items: { type: string }, description: refs in the same import. }
        children: { type: array, items: { $ref: '#/components/schemas/WBSNode' } }
    PreviewStats:
      type: object
      properties:
        stageCount: { type: integer }
        rootCount: { type: integer }
        subActionCount: { type: integer }
    PreviewResult:
      type: object
      properties:
        roots:
          type: array
          items: { $ref: '#/components/schemas/WBSNode' }
        warnings: { type: array, items: { type: string } }
        errors:
          type: array
          items: { type: string }
          description: Data-quality problems. A non-empty list blocks :confirm.
        stats: { $ref: '#/components/schemas/PreviewStats' }
    ConfirmResult:
      type: object
      properties:
        importId: { type: string, format: uuid }
        auditEventId: { type: string, format: uuid, description: The one plan_import audit event for the batch. }
        stageCount: { type: integer }
        rootCount: { type: integer }

    # ── Slice B3 live record + materials + budget movement (LINA-217) ────────

    RecordState:
      type: string
      enum: [accepted, deviation]
      description: >-
        Derived per-line (a movement = deviation), rolled up for the record.
        `closed_and_verified` is deferred to v1 (contract §7).
    LineMaterial:
      type: object
      properties:
        id: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        planVersionId: { type: string, format: uuid }
        kind: { type: string, enum: [material, labour] }
        name: { type: string }
        unit: { type: string }
        quantity: { type: number, description: numeric(14,3) — fractional units are real (m², hr). }
        unitPriceCents: { type: integer, description: Integer cents. }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MovementView:
      type: object
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        projectId: { type: string, format: uuid }
        lineMaterialId: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        movementKind: { type: string, enum: [scope_change, price_movement] }
        priceCause: { type: [string, 'null'], enum: [index, supplier_quote, correction, null] }
        newQuantity: { type: [number, 'null'] }
        newUnitPriceCents: { type: [integer, 'null'] }
        valueDeltaCents: { type: integer, description: Signed; a credit is negative. }
        source: { type: [string, 'null'] }
        changeOrderId: { type: [string, 'null'], format: uuid }
        movedByPartyId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        auditEventId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    RecordLine:
      type: object
      properties:
        stageId: { type: string, format: uuid }
        name: { type: string }
        trade: { type: [string, 'null'] }
        position: { type: integer }
        state: { $ref: '#/components/schemas/RecordState' }
        plannedCostCents: { type: integer }
        currentValueCents: { type: integer }
        materials:
          type: array
          items: { $ref: '#/components/schemas/LineMaterial' }
        compare:
          type: object
          description: Always present — Compare stays available on a closed line (contract §3a).
          properties:
            plannedCostCents: { type: integer }
            currentValueCents: { type: integer }
    BaselineRef:
      type: object
      properties:
        planVersionId: { type: string, format: uuid }
        versionNo: { type: integer }
        frozenAt: { type: string, format: date-time }
    ScheduleLine:
      type: object
      properties:
        stageId: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        plannedStartDate: { type: [string, 'null'], format: date }
        plannedEndDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/Status' }
        percent: { type: [integer, 'null'], description: Advisory; present only while in_progress. }
    AuditEvent:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        seq: { type: integer }
        type: { type: string }
        actorPartyId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        payload: { type: object }
    RecordView:
      type: object
      properties:
        state: { $ref: '#/components/schemas/RecordState' }
        baseline: { type: [object, 'null'], description: null until a baseline exists. }
        tabs:
          type: object
          properties:
            plan:
              type: object
              properties:
                lines: { type: array, items: { $ref: '#/components/schemas/RecordLine' } }
            schedule:
              type: object
              properties:
                lines: { type: array, items: { $ref: '#/components/schemas/ScheduleLine' } }
            money: { $ref: '#/components/schemas/MoneyView' }
            history:
              type: object
              properties:
                events: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
    MaterialInput:
      type: object
      required: [name, unit, quantity, unitPriceCents]
      properties:
        kind: { type: string, enum: [material, labour], default: material }
        name: { type: string, maxLength: 200 }
        unit: { type: string, maxLength: 200, description: 'm2, each, hr, …' }
        quantity:
          type: number
          minimum: 0
          maximum: 1000000
          description: numeric(14,3); cents extended = quantity × unitPriceCents.
        unitPriceCents: { type: integer, minimum: 0, maximum: 1000000000000 }
        position: { type: integer, minimum: 0, default: 0 }
    MaterialAuthor:
      type: object
      required: [materials]
      properties:
        materials: { type: array, items: { $ref: '#/components/schemas/MaterialInput' } }
    LineMaterials:
      type: object
      properties:
        lineMaterials: { type: array, items: { $ref: '#/components/schemas/LineMaterial' } }
        movements: { type: array, items: { $ref: '#/components/schemas/MovementView' } }
    SwapInput:
      type: object
      required: [lineMaterialId, movementKind]
      properties:
        lineMaterialId: { type: string, format: uuid }
        movementKind: { type: string, enum: [scope_change, price_movement] }
        priceCause: { type: [string, 'null'], enum: [index, supplier_quote, correction], description: Required iff price_movement. }
        newQuantity: { type: [number, 'null'], description: For a scope_change (qty changed); optional for price_movement. }
        newUnitPriceCents: { type: [integer, 'null'], description: For a price_movement, or a scope re-spec. }
        source: { type: [string, 'null'], maxLength: 500, description: Provenance — 'ACME steel index 2026-09', 'quote #4471'. }
        changeOrder:
          type: [object, 'null']
          description: scope_change only — cost delta is DERIVED server-side = valueDelta; never client-supplied.
          properties:
            title: { type: string }
    ChangeOrderRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        title: { type: string }
    SwapResult:
      type: object
      properties:
        movement: { $ref: '#/components/schemas/MovementView' }
        changeOrder: { type: [object, 'null'], description: Present iff scope_change. }
    ScopeChangeItem:
      type: object
      properties:
        movementId: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        lineMaterialId: { type: string, format: uuid }
        valueDeltaCents: { type: integer }
        changeOrder: { $ref: '#/components/schemas/ChangeOrderRef' }
        movedByPartyId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    PriceMovementItem:
      type: object
      properties:
        movementId: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        lineMaterialId: { type: string, format: uuid }
        priceCause: { type: string }
        source: { type: [string, 'null'] }
        baselineUnitPriceCents: { type: integer, description: Shown vs baseline so an index rise reads as a price delta. }
        newUnitPriceCents: { type: integer }
        valueDeltaCents: { type: integer }
        movedByPartyId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    MoneyView:
      type: object
      properties:
        baselineBudgetCents: { type: integer }
        currentBudgetCents: { type: integer, description: Read from the ledger — baseline + approved CO deltas; never recomputed. }
        scopeChanges: { type: array, items: { $ref: '#/components/schemas/ScopeChangeItem' } }
        priceMovements: { type: array, items: { $ref: '#/components/schemas/PriceMovementItem' } }

    PlanTemplateBody:
      description: >-
        The names-only two-level scaffold shape — identical to PLAN_SKELETON. Two
        levels only; no dates, owners, or ids. A phase carries ONLY name + tasks;
        a task is a bare name string.
      type: array
      items:
        type: object
        required: [name, tasks]
        additionalProperties: false
        properties:
          name: { type: string, maxLength: 200 }
          tasks:
            type: array
            items: { type: string, maxLength: 200 }
    PlanTemplateUpsert:
      type: object
      required: [body]
      properties:
        name: { type: string, maxLength: 200, description: Optional label; defaults to "My default". }
        body: { $ref: '#/components/schemas/PlanTemplateBody' }
    PlanTemplateResolved:
      type: object
      properties:
        source:
          type: string
          enum: [user, system]
          description: Which rung of the resolve ladder answered.
        body: { $ref: '#/components/schemas/PlanTemplateBody' }
        template:
          type: object
          properties:
            id: { type: string, format: uuid }
            ownerScope: { type: string, enum: [system, org, user] }
            name: { type: string }
            isDefault: { type: boolean }
            updatedAt: { type: string, format: date-time }

    StageCommentCreate:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: Trimmed server-side. A body-supplied author is ignored.
    StageComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string, maxLength: 4000 }
        authorPartyId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    StageAttachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string, maxLength: 255 }
        contentType:
          type: string
          description: Server-sniffed from magic bytes; never the browser-declared type.
        sizeBytes: { type: integer, maximum: 10485760 }
        uploaderPartyId: { type: string, format: uuid }
        blobUrl: { type: string, format: uri, description: Public Vercel Blob URL. }
        createdAt: { type: string, format: date-time }
    Workspace:
      type: object
      description: One fetch for the task workspace/task-detail drawer (LINA-249).
      properties:
        stageKey: { type: string, maxLength: 200 }
        comments:
          type: array
          items: { $ref: '#/components/schemas/StageComment' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/StageAttachment' }

    # ── RFP procurement loop (LINA-279, ADR-0023) ────────────────────────────
    R2Ref:
      type: object
      description: An R2/Vercel-Blob attachment reference, mirroring stage_attachment.
      additionalProperties: false
      required: [key, filename, size, content_type]
      properties:
        key: { type: string }
        filename: { type: string, maxLength: 255 }
        size: { type: integer, minimum: 0 }
        content_type: { type: string }
        url: { type: string, format: uri }

    RfpSaveBody:
      type: object
      required: [description, specialties]
      additionalProperties: false
      properties:
        description:
          type: string
          maxLength: 6000
        specialties:
          type: array
          maxItems: 20
          description: Trimmed, deduplicated trade tags (each ≤ 100 chars).
          items: { type: string, maxLength: 100 }
    RfpView:
      type: object
      description: The RFP row shaped for the API boundary. status walks draft → sent → closed.
      properties:
        id: { type: string, format: uuid }
        phaseId: { type: string, format: uuid }
        description: { type: string, maxLength: 6000 }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/FileRef' }
        specialties:
          type: array
          items: { type: string }
        status: { type: string, enum: [draft, sent, closed] }
        updatedAt: { type: string, format: date-time }

    RfpRecipientsInput:
      type: object
      required: [emails]
      additionalProperties: false
      properties:
        emails:
          type: array
          minItems: 1
          description: Normalised (trim + lowercase) and deduplicated server-side.
          items: { type: string, format: email }
    Recipient:
      type: object
      description: >-
        An external invitee. The raw token is NEVER in this shape or anywhere in
        a response — the email link is the only delivery (ADR-0023 §5).
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [invited, viewed, submitted, declined] }
    RfpRecipientsResult:
      type: object
      properties:
        recipients:
          type: array
          items: { $ref: '#/components/schemas/Recipient' }

    ProcurementView:
      type: object
      description: What the procurement page renders (LINA-283).
      properties:
        phase:
          type: object
          description: The procurement phase as phase view (id, kind, name, status, sequence).
        rfp:
          type: [RfpView, 'null']
          description: null until the first draft is saved.
        recipients:
          type: array
          items: { $ref: '#/components/schemas/Recipient' }
        proposals:
          type: array
          description: Owner's / GC's comparison inbox, newest first.
          items: { $ref: '#/components/schemas/Proposal' }
        selectedProposalId:
          type: [string, 'null'] # selection is LINA-280; reserved here so the page does not shift shape.
          format: uuid

    ProposalSubmit:
      type: object
      required: [companyName, websiteUrl, budgetMinCents, budgetMaxCents, timelineDays]
      additionalProperties: false
      properties:
        companyName: { type: string, minLength: 1, maxLength: 200 }
        websiteUrl:
          type: string
          description: An http(s) URL with a dotted hostname.
        portfolioImages:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/FileRef' }
        budgetMinCents: { type: integer, minimum: 0 }
        budgetMaxCents: { type: integer, minimum: 0, description: Must be >= budgetMinCents. }
        timelineDays: { type: integer, minimum: 1, maximum: 3650 }
        comment:
          type: [string, 'null']
          maxLength: 4000
    Proposal:
      type: object
      description: >-
        An append-only submission; never edited or deleted. recipientEmail is the
        submitter's public face. The token route echoes id-less (ADR-0023 §5);
        the procurement inbox adds id, rfpRecipientId.
      properties:
        id: { type: string, format: uuid }
        rfpRecipientId: { type: string, format: uuid }
        recipientEmail: { type: string, format: email }
        companyName: { type: string, maxLength: 200 }
        websiteUrl: { type: string }
        portfolioImages:
          type: array
          items: { $ref: '#/components/schemas/FileRef' }
        budgetMinCents: { type: integer }
        budgetMaxCents: { type: integer }
        timelineDays: { type: integer }
        comment: { type: ['string', 'null'] }
        submittedAt: { type: string, format: date-time }

    TokenPreview:
      type: object
      description: What the proposal form renders behind /rfp/[token] (ADR-0023 §5).
      properties:
        project:
          type: object
          description: Dereferenced via identity.getProjectPreview (ADR-0006).
          properties:
            name: { type: string }
            location:
              type: [string, 'null']
              description: Reserved-null until a locality column exists.
        recipientEmail: { type: string, format: email }
        rfp:
          type: object
          properties:
            description: { type: string, maxLength: 6000 }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/FileRef' }
            specialties:
              type: array
              items: { type: string }
        proposal:
          type: [Proposal, 'null']
          description: null during the window; the submitted view once spent.
