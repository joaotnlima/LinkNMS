openapi: '3.1.0'
info:
  title: 'LinkNMS Identity & Membership'
  version: '0.1.0'
  description: 'Projects, memberships, invitations, and the sole authorizer (ADR-0004). The acting party is always derived server-side from the session, never the body.'
servers:
  - url: /api/v1
paths:
  '/me':
    get:
      operationId: getMe
      summary: 'The acting party’s own profile (identity.party): display name, email, role.'
      responses:
        '200':
          description: The party’s profile
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/MeProfile'
        '401':
          description: No acting party in session
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '404':
          description: Party not found
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
  '/me/profile':
    post:
      operationId: completeProfile
      summary: 'First-login account setup: display name, role choice, language. Once only.'
      description: 'Self-only — the party is the session’s and cannot be named in the body (ADR-0004). The role is a CHOICE recorded on the party, not a grant: access to any build is membership, minted only by creating a project or accepting an invitation. Idempotent: a repeat submit is 409 and the client treats it as success.'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              '$ref': '#/components/schemas/CompleteProfileRequest'
      responses:
        '200':
          description: Profile stored
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/CompletedProfile'
        '400':
          description: Invalid field; the body names the offending field
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '401':
          description: No acting party in session
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '409':
          description: Profile already set up
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
  '/projects':
    get:
      operationId: listProjects
      summary: 'The acting party’s own portfolio: every build they are a member of, most-recent-first (ADR-0012 §A1).'
      description: 'Membership-scoped to the session — the party is NEVER a body/query param, and an acting party can only ever list their own builds. Drafts are included (badged `draft`) so an abandoned wizard is resumable. Budgets are ledger-authoritative (baseline + Σ approved change orders); per-card counts are batched server-side.'
      responses:
        '200':
          description: 'The party’s projects, ordered most-recent-first'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/ProjectList'
        '401':
          description: No acting party in session
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
    post:
      operationId: createProject
      summary: Start a shared record; the creator becomes its owner (FR1).
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              '$ref': '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Project'
        '400':
          description: Invalid name or baseline
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '401':
          description: No acting party in session
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
  '/projects/{id}':
    get:
      operationId: getProject
      summary: Project + memberships + budget summary. Members only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project view
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Project'
        '401':
          description: No acting party in session
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Not a member of this project
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
  '/projects/{id}/operating-model':
    patch:
      operationId: setOperatingModel
      summary: Choose the operating model on a draft (Band B wizard step 2). Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              '$ref': '#/components/schemas/SetOperatingModelRequest'
      responses:
        '200':
          description: Operating model set; updated project view
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Project'
        '400':
          description: Unsupported operating model
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '401':
          description: No acting party in session
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Only the owner may set the operating model
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '409':
          description: The project is not a draft
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
  '/projects/{id}/invitations':
    post:
      operationId: inviteCounterparty
      summary: Invite the role the build’s operating model admits (Band B). Owner only (FR1).
      description: 'Turnkey invites counterparty, direct invites subcontractor, hybrid invites either. The first invite on a draft commits the build (draft→active).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          'application/json':
            schema:
              '$ref': '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: Invitation minted; raw token returned once
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/InvitationCreated'
        '400':
          description: Unsupported role
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '401':
          description: No acting party in session
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Only the owner may invite
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '409':
          description: A counterparty or pending invite already exists
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
  '/invitations/{token}/accept':
    post:
      operationId: acceptInvitation
      summary: The invited GC accepts and joins as counterparty.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Joined; membership created
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/MembershipCreated'
        '400':
          description: Missing token
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '401':
          description: No acting party in session
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '404':
          description: Invitation not found
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '409':
          description: 'Invitation already accepted, or already a member'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
  '/invitations/{token}':
    get:
      operationId: previewInvitation
      summary: 'The unauthenticated invite preview behind the Band B accept deep link (LINA-182).'
      description: 'Returned to a signed-out visitor who holds only the token: which build they were invited to, who invited them, and the email the invitation was mailed to (for the inline sign-up pre-fill). The token is the credential for this read. Unknown and already-accepted tokens return the IDENTICAL 404, so the endpoint is not a token-validity oracle. Rate-limited at the transport layer.'
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation preview
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/InvitationPreview'
        '400':
          description: Missing token
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '404':
          description: 'Unknown or already-accepted invitation — deliberately indistinguishable'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - unauthenticated
                - forbidden
                - not_found
                - conflict
                - bad_request
                - rate_limited
            message:
              type: string
    MeProfile:
      type: object
      required:
        - partyId
        - displayName
      properties:
        partyId:
          type: string
        displayName:
          type: string
        email:
          type:
            - string
            - null
        role:
          type: string
          enum:
            - owner
            - contractor
            - viewer
        language:
          type:
            - string
            - null
          enum:
            - en
            - pt
            - es
            - null
        setupComplete:
          type: boolean
    CompleteProfileRequest:
      type: object
      required:
        - displayName
        - role
        - language
      properties:
        displayName:
          type: string
        role:
          type: string
          enum:
            - owner
            - general_contractor
        language:
          type: string
          enum:
            - en
            - pt
            - es
    CompletedProfile:
      type: object
      required:
        - profile
      properties:
        profile:
          type: object
          required:
            - displayName
            - role
            - language
            - setupComplete
          properties:
            displayName:
              type: string
            role:
              type: string
              enum:
                - owner
                - general_contractor
            language:
              type: string
              enum:
                - en
                - pt
                - es
            setupComplete:
              type: boolean
    Member:
      type: object
      required:
        - partyId
        - role
        - joinedAt
      properties:
        partyId:
          type: string
        role:
          type: string
          enum:
            - owner
            - counterparty
            - subcontractor
        joinedAt:
          type: string
    ProjectSummary:
      type: object
      required:
        - id
        - name
        - status
        - role
        - operatingModel
        - baselineBudgetCents
        - currentBudgetCents
        - members
        - counts
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
        role:
          type: string
          enum:
            - owner
            - counterparty
            - subcontractor
        operatingModel:
          type:
            - string
            - null
          enum:
            - null
            - turnkey
            - direct
            - hybrid
        baselineBudgetCents:
          type: integer
        currentBudgetCents:
          type: integer
        members:
          type: array
          items:
            type: object
            required:
              - role
              - name
            properties:
              role:
                type: string
                enum:
                  - owner
                  - counterparty
                  - subcontractor
              name:
                type:
                  - string
                  - null
        counts:
          type: object
          required:
            - changeOrders
            - decisions
          properties:
            changeOrders:
              type: integer
              minimum: 0
            decisions:
              type: integer
              minimum: 0
        updatedAt:
          type: string
    ProjectList:
      type: object
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            '$ref': '#/components/schemas/ProjectSummary'
    Project:
      type: object
      required:
        - id
        - name
        - ownerPartyId
        - baselineBudgetCents
        - currentBudgetCents
        - operatingModel
        - status
        - actingRole
        - createdAt
        - members
      properties:
        id:
          type: string
        name:
          type: string
        ownerPartyId:
          type:
            - string
            - null
        baselineBudgetCents:
          type: integer
        currentBudgetCents:
          type: integer
        operatingModel:
          type:
            - string
            - null
          enum:
            - null
            - turnkey
            - direct
            - hybrid
        status:
          type: string
          enum:
            - draft
            - active
        siteAddress:
          type:
            - string
            - null
        buildType:
          type:
            - string
            - null
        expectedStart:
          type:
            - string
            - null
        actingRole:
          type: string
          enum:
            - owner
            - counterparty
            - subcontractor
        createdAt:
          type: string
        members:
          type: array
          items:
            '$ref': '#/components/schemas/Member'
    Membership:
      type: object
      required:
        - id
        - projectId
        - partyId
        - role
        - joinedAt
      properties:
        id:
          type: string
        projectId:
          type: string
        partyId:
          type: string
        role:
          type: string
          enum:
            - owner
            - counterparty
            - subcontractor
        joinedAt:
          type: string
    Invitation:
      type: object
      required:
        - id
        - projectId
        - role
        - status
        - createdAt
      properties:
        id:
          type: string
        projectId:
          type: string
        role:
          type: string
          enum:
            - owner
            - counterparty
            - subcontractor
        status:
          type: string
          enum:
            - pending
            - accepted
        email:
          type:
            - string
            - null
          description: 'The address the invitation was mailed to; null on the out-of-band path.'
        inviteeName:
          type:
            - string
            - null
          description: 'The invitee’s name or company, as the inviter typed it on the Invite screen (LINA-222). Optional; null when not given.'
        scopeNote:
          type:
            - string
            - null
          description: 'A free-text note the inviter wrote describing the invitee’s scope (LINA-222). Optional; null when not given.'
        createdAt:
          type: string
    InvitationCreated:
      type: object
      required:
        - invitation
        - token
      properties:
        invitation:
          '$ref': '#/components/schemas/Invitation'
        token:
          type: string
        emailed:
          type: boolean
          description: 'True only when the invitation was actually handed to the mailer. The raw token is returned either way, so a delivery failure never strands the inviter.'
    InvitationPreview:
      type: object
      required:
        - projectName
        - invitedByName
        - role
        - email
        - status
      properties:
        projectName:
          type:
            - string
            - null
        invitedByName:
          type:
            - string
            - null
        role:
          type: string
          enum:
            - counterparty
            - subcontractor
        email:
          type:
            - string
            - null
          description: 'The address the invitation was mailed to; null on the out-of-band path. Returned because it is the INVITEE’s own address (pre-fill), not a third party’s.'
        status:
          type: string
          enum:
            - pending
    MembershipCreated:
      type: object
      required:
        - membership
      properties:
        membership:
          '$ref': '#/components/schemas/Membership'
    CreateProjectRequest:
      type: object
      required:
        - name
        - baselineBudgetCents
      properties:
        name:
          type: string
        baselineBudgetCents:
          type: integer
          minimum: 0
        draft:
          type: boolean
          default: false
          description: Create the build as a draft (Band B wizard step 1).
        creatorRole:
          type: string
          default: owner
          enum:
            - owner
            - counterparty
          description: 'Role screen (LINA-221, ADR-0016): owner (default) or counterparty for a GC-created build.'
        siteAddress:
          type: string
          description: Site address (Basics).
        buildType:
          type: string
          description: Build type slug (Basics).
        expectedStart:
          type: string
          description: 'Expected start month, YYYY-MM (Basics).'
    InviteRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - owner
            - counterparty
            - subcontractor
          description: 'Invited role. `owner` only on a GC-created build with no owner yet (ADR-0016).'
        email:
          type:
            - string
            - null
          format: email
          description: 'Optional (LINA-84). Supplied, the invitation link is emailed to this address and the response reports `emailed`. Omitted, nothing is sent and the caller delivers the raw token out of band. Lower-cased server-side, same normalisation as sign-in.'
        inviteeName:
          type:
            - string
            - null
          maxLength: 200
          description: 'Optional (LINA-222). The invitee’s name or company, from the Invite screen. Trimmed server-side; blank is stored as null.'
        scopeNote:
          type:
            - string
            - null
          maxLength: 1000
          description: 'Optional (LINA-222). A free-text note describing the invitee’s scope, from the Invite screen. Trimmed server-side; blank is stored as null.'
    SetOperatingModelRequest:
      type: object
      required:
        - operatingModel
      properties:
        operatingModel:
          type: string
          enum:
            - turnkey
            - direct
            - hybrid
