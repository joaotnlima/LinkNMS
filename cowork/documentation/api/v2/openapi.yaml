openapi: 3.1.0
info:
  title: LinkNMS API
  version: 2.0.0-stub
  description: 'Contract-first stub of the to-be API. **Source of truth for the UI and for the MCP server.** Behaviour is
    specified in `cowork/documentation/to-be/` (05 plan, 06 tendering, 04/16 access). Every operation states the Clerk permission
    it needs (`x-clerk-permission`), the relationship LinkNMS checks (`x-relationship`) and, when exposed to agents, its MCP
    tool name (`x-mcp-tool`).


    Conventions (to-be/11): acting org = Clerk active organization; money in integer cents EUR; ids UUIDv7 (client-generated
    on create); fields the viewer may not read are absent (see `_visibility`); plan rows use field-level deltas with last-write-wins;
    other aggregates use If-Match.'
  contact:
    name: LinkNMS
servers:
- url: https://portal.linknms.com/api/v2
  description: production
- url: https://dev.portal.linknms.com/api/v2
  description: dev
- url: http://localhost:3000/api/v2
  description: local
security:
- clerkSession: []
tags:
- name: Identity & Access
  description: Clerk owns people, organisations, roles and permissions; LinkNMS mirrors them for attribution. See to-be/16.
- name: Directory
  description: Company profiles, specialties, service areas, portfolio. See to-be/07.
- name: Project
  description: 'The build: brief, locations, participants, calendar, share links. See to-be/03.'
- name: Planning
  description: 'The plan (WBS + timeline): rows, links, propagation, baselines, variations, progress, templates. See to-be/05.'
- name: Tendering
  description: RFP from plan rows, individual invitations, proposal lanes, comparison, award. See to-be/06.
- name: Contracting
  description: Contract tree, change orders (optional formalisation), measurements, payment records. See to-be/06.
- name: Quality
  description: Verification of completed work, non-conformities, inspections. See to-be/08, 17.
- name: Documents
  description: Versioned, scoped files; sha256 in the ledger. See to-be/08.
- name: Collaboration
  description: Comments, questions, minutes, activity, notifications. See to-be/08.
- name: Record
  description: Tamper-evident, hash-chained ledger, projected per viewer. See to-be/08.
- name: Reputation
  description: Reviews after completion + objective metrics. See to-be/07.
- name: Billing
  description: Plans, subscriptions, entitlements, sponsorship. See to-be/07, 16 §9.
- name: Realtime
  description: Live stream per project. See to-be/11.
paths:
  /me:
    get:
      tags:
      - Identity & Access
      operationId: getMe
      summary: 'Who am I: person, active org, role, permissions, orgs, pending project invitations'
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** none


        **MCP tool:** `whoami`'
      x-mcp-tool: whoami
      x-mcp-mode: read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations:
    post:
      tags:
      - Identity & Access
      operationId: createOrganization
      summary: Create my company or household (creates the Clerk org and its role set)
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** none'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /organizations/{orgId}/members:
    get:
      tags:
      - Identity & Access
      operationId: listMembers
      summary: Members of my organisation (mirror of Clerk memberships)
      description: '**Clerk permission:** `org:members:manage`


        **Relationship (LinkNMS):** none'
      x-clerk-permission: org:members:manage
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Person'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/staffing/{personId}:
    put:
      tags:
      - Identity & Access
      operationId: staffPerson
      summary: Put one of my people on a project
      description: '**Clerk permission:** `org:projects:staff`


        **Relationship (LinkNMS):** project.participant'
      x-clerk-permission: org:projects:staff
      x-relationship: project.participant
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/personId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staffing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - Identity & Access
      operationId: unstaffPerson
      summary: Remove one of my people from a project
      description: '**Clerk permission:** `org:projects:staff`


        **Relationship (LinkNMS):** project.participant'
      x-clerk-permission: org:projects:staff
      x-relationship: project.participant
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/personId'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /webhooks/clerk:
    post:
      tags:
      - Identity & Access
      operationId: clerkWebhook
      summary: 'Clerk webhook: user.*, organization.*, organizationMembership.* → identity mirror'
      description: 'Svix-signed. Rejects deleting an org that is party to a signed contract.


        **Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** none'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /organizations/{orgId}/profile:
    put:
      tags:
      - Directory
      operationId: putProfile
      summary: Edit my public profile, areas, specialties, declared credentials
      description: '**Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** none'
      x-clerk-permission: org:profile:manage
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /organizations/{orgId}/profile/completeness:
    get:
      tags:
      - Directory
      operationId: getCompleteness
      summary: Completeness score and what raises it
      description: '**Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** none'
      x-clerk-permission: org:profile:manage
      parameters:
      - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completeness'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{orgId}/portfolio:
    post:
      tags:
      - Directory
      operationId: addPortfolioEntry
      summary: Add a declared portfolio entry
      description: '**Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** none'
      x-clerk-permission: org:profile:manage
      parameters:
      - $ref: '#/components/parameters/orgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioEntry'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /organizations/{orgId}/portfolio/{entryId}:
    delete:
      tags:
      - Directory
      operationId: deletePortfolioEntry
      summary: Remove a declared portfolio entry
      description: '**Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** none'
      x-clerk-permission: org:profile:manage
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/entryId'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /directory/organizations:
    get:
      tags:
      - Directory
      operationId: searchOrganizations
      summary: Search companies by specialty, area, kind, rating
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** none


        **MCP tool:** `find_companies`'
      x-mcp-tool: find_companies
      x-mcp-mode: read
      parameters:
      - name: specialty
        in: query
        required: false
        schema:
          type: string
      - name: municipality
        in: query
        required: false
        schema:
          type: string
      - name: district
        in: query
        required: false
        schema:
          type: string
      - name: kind
        in: query
        required: false
        schema:
          type: string
      - name: min_rating
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/OrganizationProfile'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /directory/organizations/{orgId}:
    get:
      tags:
      - Directory
      operationId: getDirectoryOrganization
      summary: 'A company: profile, portfolio, rating, metrics'
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** none


        **MCP tool:** `get_company`'
      x-mcp-tool: get_company
      x-mcp-mode: read
      parameters:
      - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /specialties:
    get:
      tags:
      - Directory
      operationId: listSpecialties
      summary: Specialty catalogue
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** none


        **MCP tool:** `list_specialties`'
      x-mcp-tool: list_specialties
      x-mcp-mode: read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Specialty'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects:
    post:
      tags:
      - Project
      operationId: createProject
      summary: Create a project (the brief)
      description: '**Clerk permission:** `org:projects:create`


        **Relationship (LinkNMS):** none


        **MCP tool:** `create_project`'
      x-clerk-permission: org:projects:create
      x-mcp-tool: create_project
      x-mcp-mode: write-confirm
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      tags:
      - Project
      operationId: listProjects
      summary: My projects (portfolio) with status, variance, open items
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** none


        **MCP tool:** `list_projects`'
      x-mcp-tool: list_projects
      x-mcp-mode: read
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: capacity
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProjectOverview'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}:
    get:
      tags:
      - Project
      operationId: getProject
      summary: Project
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** project.participant'
      x-relationship: project.participant
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Project
      operationId: updateProject
      summary: Edit the brief
      description: '**Clerk permission:** `org:plan:edit`


        **Relationship (LinkNMS):** project.owner'
      x-clerk-permission: org:plan:edit
      x-relationship: project.owner
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /projects/{projectId}:claim:
    post:
      tags:
      - Project
      operationId: claimProject
      summary: Owner claims a project created on its behalf
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** invited owner'
      x-relationship: invited owner
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /projects/{projectId}:cancel:
    post:
      tags:
      - Project
      operationId: cancelProject
      summary: Cancel (no signed contract)
      description: '**Clerk permission:** `org:projects:create`


        **Relationship (LinkNMS):** project.owner'
      x-clerk-permission: org:projects:create
      x-relationship: project.owner
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /projects/{projectId}:close:
