    FileType:
      type: string
      description: 'Derived from the file name (and mime): what the Files tab tags a row with and filters on.'
      enum:
      - pdf
      - dwg
      - dxf
      - ifc
      - image
      - other
    PreviewStatus:
      type: string
      description: 'Preview state (PRD-05 F-7, PRD-06 V-11, V-14, V-17): `ready` (viewable / no preview needed),
        `pending` (a DWG or DXF waits for its server-side conversion, D-49 — "Making preview…"), `unavailable` (the
        conversion failed or no converter is configured: no preview, download only; the reason rides on
        `preview_reason`). `pending` is set for DWG and DXF uploads; every other type is `ready`.'
      enum:
      - ready
      - pending
      - unavailable
    MarkupKind:
      type: string
      description: '`cloud` (two opposite corners), `arrow` (tail, head — "arrow + note", needs `text`), `text` (one
        anchor point, needs `text`), `measure` (two points; the length shows only once the sheet is calibrated, V-6),
        `calibration` (two points on a known dimension + `geometry.length_mm`; the latest calibration of a page sets
        its scale).'
      enum:
      - cloud
      - arrow
      - text
      - measure
      - calibration
    MarkupGeometry:
      type: object
      description: 'Points in sheet units — PDF points of the page as displayed at scale 1 (rotation applied), or the DWG preview''s SVG units —
        so a length is isotropic and resolution-independent. `cloud`, `arrow`, `measure`, `calibration`: exactly 2
        points; `text`: exactly 1. Every coordinate finite, |v| ≤ 1e9. `length_mm` (calibration only): the real length
        of the measured dimension, > 0.'
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        length_mm:
          type: number
          exclusiveMinimum: 0
      required:
      - points
    MarkupState:
      type: string
      enum:
      - open
      - closed
    MarkupDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: client-generated (UUIDv7) — the idempotency key of this markup
        page_or_layout:
          type: string
          minLength: 1
          maxLength: 200
          description: PDF page number as text (`"1"`), or the DWG/DXF layout name
        kind:
          $ref: '#/components/schemas/MarkupKind'
        geometry:
          $ref: '#/components/schemas/MarkupGeometry'
        text:
          type: string
          maxLength: 2000
      required:
      - id
      - page_or_layout
      - kind
      - geometry
    MarkupSave:
      type: object
      properties:
        base_version_no:
          type: integer
          minimum: 1
          description: the version the markups were drawn on — must be the current one
        markups:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/MarkupDraft'
        note:
          type: string
          maxLength: 2000
          description: optional change note of the new version (the history labels it "markups only" either way)
      required:
      - base_version_no
      - markups
    ProjectModelVersionCreate:
      type: object
      required: [file]
      properties:
        file:
          $ref: '#/components/schemas/FileDeclaration'
        note:
          type: string
          maxLength: 2000
        global_ids:
          type: array
          maxItems: 500000
          description: 'M-18: the element GlobalIds of the new file, extracted by the client from the bytes it
            uploads (the server does not download and parse up to 100 MB per upload). Validated (shape, size,
            duplicates dropped) and kept with the version; when the upload completes the server compares them
            with the record and the previous upload — `ProjectModel.upload_check`. Optional: without it there
            is no check.'
          items: { type: string, pattern: '^[0-9A-Za-z_$]{22}$' }
    ModelUploadCheck:
      type: object
      description: 'M-18, computed by the server when a new .ifc of the model completed: recorded elements (live
        links and issue pins) missing from the file — they stay on the record for relinking — and whether the
        export regenerated its GlobalIds (shares under 10% of elements with the previous upload).'
      properties:
        version_no: { type: integer }
        element_count: { type: integer }
        unmatched_global_ids: { type: array, items: { type: string } }
        regenerated: { type: boolean }
        shared_count: { type: integer }
        recorded_count: { type: integer }
      required: [version_no, unmatched_global_ids, regenerated]
    ElementLink:
      type: object
      description: An element (IFC GlobalId) linked to a plan row — record-side, survives re-uploads (PRD-07, D-45).
      properties:
        global_id: { type: string, pattern: '^[0-9A-Za-z_$]{22}$' }
        task_id: { type: string, format: uuid }
        added_in_version: { type: integer }
        linked_by:
          $ref: '#/components/schemas/Actor'
        linked_at: { type: string, format: date-time }
      required: [global_id, task_id, added_in_version, linked_by, linked_at]
    ElementPin:
      type: object
      description: An issue pinned on model elements, naming the tasks it concerns (PRD-07 M-5).
      properties:
        id: { type: string, format: uuid }
        global_ids: { type: array, items: { type: string }, minItems: 1, maxItems: 200 }
        task_ids: { type: array, items: { type: string, format: uuid }, maxItems: 20 }
        text: { type: string }
        state: { type: string, enum: [open, closed] }
        version_no: { type: integer }
        closed_in_version: { type: integer }
        author:
          $ref: '#/components/schemas/Actor'
        created_at: { type: string, format: date-time }
      required: [id, global_ids, task_ids, text, state, version_no, author, created_at]
    ModelTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: 'outline code, e.g. "2.5.1"' }
        name: { type: string }
        parent_id: { type: string, format: uuid, nullable: true }
        status: { type: string }
        assignee_org_id: { type: string, format: uuid, nullable: true }
        assignee_org_name: { type: string, nullable: true }
        element_count: { type: integer }
      required: [id, code, name, status, element_count]
    ProjectModel:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        document:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Document'
        author_org_id: { type: string, format: uuid }
        viewing_version: { type: integer }
        links: { type: array, items: { $ref: '#/components/schemas/ElementLink' } }
        pins: { type: array, items: { $ref: '#/components/schemas/ElementPin' } }
        tasks: { type: array, items: { $ref: '#/components/schemas/ModelTask' } }
        viewer:
          type: object
          properties:
            scope:
              type: object
              properties:
                kind: { type: string, enum: [author, owner, whole, tasks, none] }
                task_ids: { type: array, items: { type: string, format: uuid } }
                element_count: { type: integer, nullable: true }
                edits_all: { type: boolean, description: 'M-8: the viewer edits every element (author, owner).' }
                editable_global_ids:
                  type: array
                  description: 'M-8, when not `edits_all`: the elements the viewer may link, unlink or pin — the server''s
                    answer; the UI reads it instead of re-deriving the scope.'
                  items: { type: string }
            can_upload: { type: boolean }
            can_restore: { type: boolean }
        access:
          type: object
          properties:
            readers: { type: string, enum: [participants] }
            editors:
              type: array
              items:
                type: object
                properties:
                  org_id: { type: string, format: uuid }
                  org_name: { type: string }
                  role: { type: string, enum: [author, owner, branch] }
                  task_ids: { type: array, items: { type: string, format: uuid } }
                  element_count: { type: integer, nullable: true }
            unassigned_tasks:
              type: array
              description: rows with linked elements nobody but the owner edits yet — they open for whoever is awarded them
              items:
                type: object
                properties:
                  task_id: { type: string, format: uuid }
                  element_count: { type: integer }
        upload_check:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ModelUploadCheck'
      required: [project_id, document, links, pins, tasks, viewer, access]
    ModelEditChange:
      type: object
      description: 'One record-side change. `link` / `unlink` need `global_id` + `task_id`; `pin` needs `pin`; `close_pin` needs `pin_id`.'
      required: [op]
      properties:
        op: { type: string, enum: [link, unlink, pin, close_pin] }
        global_id: { type: string, pattern: '^[0-9A-Za-z_$]{22}$' }
        task_id: { type: string, format: uuid }
        pin:
          type: object
          required: [id, global_ids, text]
          properties:
            id: { type: string, format: uuid }
            global_ids: { type: array, items: { type: string }, minItems: 1, maxItems: 200 }
            task_ids: { type: array, items: { type: string, format: uuid }, maxItems: 20 }
            text: { type: string, minLength: 1, maxLength: 2000 }
        pin_id: { type: string, format: uuid }
    ModelEditSave:
      type: object
      required: [base_version_no, note, changes]
      properties:
        base_version_no: { type: integer, minimum: 1, description: the version the draft was made on }
        note: { type: string, minLength: 1, maxLength: 2000 }
        changes: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/ModelEditChange' } }
        resolutions:
          type: object
          description: 'element-level choices after a 409: {GlobalId: "mine" | "theirs"}'
          additionalProperties: { type: string, enum: [mine, theirs] }
    ModelEditResult:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/Document'
        version_no: { type: integer }
        change_count: { type: integer }
        dropped: { type: integer, description: changes dropped by a "theirs" resolution }
        edited_by_author: { type: boolean }
      required: [document, version_no, change_count]
    ModelRecordDiff:
      type: object
      properties:
        from: { type: integer }
        to: { type: integer }
        links_added: { type: array, items: { type: object, properties: { global_id: { type: string }, task_id: { type: string, format: uuid } } } }
        links_removed: { type: array, items: { type: object, properties: { global_id: { type: string }, task_id: { type: string, format: uuid } } } }
        pins_added: { type: array, items: { $ref: '#/components/schemas/ElementPin' } }
        pins_closed: { type: array, items: { $ref: '#/components/schemas/ElementPin' } }
      required: [from, to, links_added, links_removed, pins_added, pins_closed]
    TaskModel:
      type: object
      properties:
        model:
          type: object
          nullable: true
          properties:
            document_id: { type: string, format: uuid }
            title: { type: string }
            current_version: { type: integer }
            element_count: { type: integer }
            can_edit: { type: boolean }
            edit_reason: { type: string, enum: [author, owner, scope, none] }
      required: [model]
    Markup:
      type: object
      properties:
        id: *id001
        document_id: *id001
        version_no:
          type: integer
        page_or_layout:
          type: string
        kind:
          $ref: '#/components/schemas/MarkupKind'
        geometry:
          $ref: '#/components/schemas/MarkupGeometry'
        text:
          type: string
        author:
          $ref: '#/components/schemas/Actor'
        created_at: *id004
        state:
          $ref: '#/components/schemas/MarkupState'
        closed_at: *id004
        question_id:
          type: string
          format: uuid
          description: the Collaboration question this markup became (absent when none)
        nonconformity_id:
          type: string
          format: uuid
          description: the Quality issue (non-conformity) this markup points at (absent when none)
      required:
      - id
      - document_id
      - version_no
      - page_or_layout
      - kind
      - geometry
      - author
      - created_at
      - state
    MarkupSaveResult:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/Document'
        markups:
          type: array
          items:
            $ref: '#/components/schemas/Markup'
      required:
      - document
      - markups
    MarkupLink:
      type: object
      description: exactly one of the two
      properties:
        question_id:
          type: string
          format: uuid
        nonconformity_id:
          type: string
          format: uuid
    ViewUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
        expires_at: *id004
      required:
      - url
      - expires_at
    DocumentPreview:
      type: object
      properties:
        document_id: *id001
        version_no:
          type: integer
        file_type:
          $ref: '#/components/schemas/FileType'
        status:
          $ref: '#/components/schemas/PreviewStatus'
        reason:
          type: string
          description: "why there is no preview (`status: unavailable`)"
        layouts:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              name:
                type: string
              width:
                type: number
              height:
                type: number
              view_url:
                type: string
                format: uri
              expires_at: *id004
            required:
            - index
            - name
            - view_url
        layers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              color:
                type: string
                description: CSS colour when the converter knows it
              'on':
                type: boolean
                description: the layer's own on/off state in the file
              count:
                type: integer
                description: entities on the layer in the preview (absent when unknown)
            required:
            - name
            - 'on'
        warnings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              detail:
                type: string
            required:
            - code
      required:
      - document_id
      - version_no
      - status
      - layouts
      - layers
      - warnings
    VersionChangeKind:
      type: string
      description: '`edit` — a record-side model save (PRD-07 M-12: links / pins, the bytes of the version before);
        `restore` — Restore vN (M-17: vN''s bytes, `base_version_no` = N).'
      enum:
      - upload
      - markup_only
      - edit
      - restore
    DocumentLinkRole:
      type: string
      description: '`reference` — what the work is built from; `deliverable` — a file handed over by the task (its review
        state lives on the task''s deliverables, Planning).'
      enum:
      - reference
      - deliverable
    DocumentLinkSpec:
      type: object
      description: 'Link the new document to a task in the same create (PRD-05 F-6 acceptance 1: one project document
        linked to the task). Only with `scope_type: project`; needs edit scope of the task.'
      properties:
        task_id: *id001
        role:
          $ref: '#/components/schemas/DocumentLinkRole'
        include_subtasks:
          type: boolean
          default: false
      required:
      - task_id
    DocumentLinkCreate:
      type: object
      properties:
        document_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: *id001
        role:
          $ref: '#/components/schemas/DocumentLinkRole'
        include_subtasks:
          type: boolean
          default: false
          description: Also link every current sub-task (inherited, removable per sub-task) — PRD-05 F-10.
      required:
      - document_ids
    DocumentUse:
      type: object
      description: One task that links the document.
      properties:
        task_id: *id001
        role:
          $ref: '#/components/schemas/DocumentLinkRole'
        inherited:
          type: boolean
    TaskDocument:
      description: A document as it hangs on one task (PRD-05 F-3).
      allOf:
      - $ref: '#/components/schemas/Document'
      - type: object
        properties:
          role:
            $ref: '#/components/schemas/DocumentLinkRole'
          inherited:
            type: boolean
          inherited_from_task_id: *id001
          attached:
            type: boolean
            description: Scoped to the task itself (no link row) — always a reference.
          used_on:
            type: array
            items:
              $ref: '#/components/schemas/DocumentUse'
    ProjectDocument:
      description: A project file with the tasks that use it (PRD-05 F-9, F-19).
      allOf:
      - $ref: '#/components/schemas/Document'
      - type: object
        properties:
          used_on:
            type: array
            items:
              $ref: '#/components/schemas/DocumentUse'
    CommentCreate:
      type: object
      properties:
        id: *id001
        kind:
          type: string
          enum:
          - note
          - question
        body:
          type: string
          maxLength: 8000
        mentions:
          type: array
          items: *id001
        addressee_org_id: *id001
        attachment_ids:
          type: array
          items: *id001
        topic:
          $ref: '#/components/schemas/QuestionTopic'
        decision:
          description: On the answer to a `design_change` question only (required there) — the addressee
            approves or rejects the change (PRD-12 N-5).
          type: string
          enum:
          - approved
          - rejected
      required:
      - id
      - kind
      - body
    QuestionTopic:
      type: string
      description: 'What a question is (PRD-12 N-5, flows C16–C17): a `clarification` (default), a
        `design_change` the addressee approves or rejects when answering, or a `scope_gap` — work nobody
        holds, always routed to the project owner (an `addressee_org_id` naming anyone else is refused).'
      enum:
      - clarification
      - design_change
      - scope_gap
    Comment:
      type: object
      properties:
        id: *id001
        object_type:
          type: string
        object_id: *id001
        kind:
          type: string
          enum:
          - note
          - question
          - answer
        body:
          type: string
        author:
          $ref: '#/components/schemas/Actor'
        addressee_org_id: *id001
        question_status:
          type: string
          enum:
          - open
          - answered
          - resolved
        answers_comment_id: *id001
        created_at: *id004
        deleted: *id002
        project_id: *id001
        topic:
          $ref: '#/components/schemas/QuestionTopic'
        decision:
          type: string
          enum:
          - approved
          - rejected
        attachment_ids:
          type: array
          items: *id001
        actions:
          description: 'Read-only, on questions: what the viewer''s organisation may do now (`answer` the
            addressee of an open question, `resolve` the asker of an answered one).'
          type: array
          items:
            type: string
            enum:
            - answer
            - resolve
    MeetingMinute:
      type: object
      properties:
        id: *id001
        project_id: *id001
        created_by_org_id: *id001
        date: *id003
        attendees:
          type: array
          items: *id001
        items:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              owner_org_id: *id001
              due_date: *id003
              object_type:
                type: string
              object_id: *id001
        status:
          type: string
          enum:
          - draft
          - circulated
          - acknowledged
        acks:
          type: array
          items:
            type: object
            properties:
              org_id: *id001
              person_id: *id001
              at: *id004
        actions:
          description: 'Read-only, viewer-projected: `circulate` (the writing organisation, on a draft),
            `acknowledge` (an attending organisation that has not yet, on a circulated minute).'
          type: array
          items:
            type: string
            enum:
            - circulate
            - acknowledge
    ActivityItem:
      type: object
      properties:
        event_id: *id001
        type:
          type: string
        occurred_at: *id004
        actor:
          $ref: '#/components/schemas/Actor'
        summary:
          type: string
        object_type:
          type: string
        object_id: *id001
    NotificationCategory:
      type: string
      description: 'What a notification is about — the unit of preferences (PRD-12 N-2). `bids` proposals
        received (issuer); `tendering` clarifications answered, tender awarded / not selected / cancelled
        (bidders); `variations` the 15-minute change digest (owner and client of the row); `invitations`
        project invitations accepted (inviter); `questions`, `quality` collaboration and quality items; `files`
        deliverables submitted (client side of the task) / approved / sent back (assignee), and a new version of a
        file linked to a task (the task owners, PRD-05 F-11); `plan` the plan was imported into the build (the
        owner, PRD-09 O-12).'
      enum:
      - bids
      - tendering
      - variations
      - invitations
      - questions
      - quality
      - files
      - plan
    NotificationSummary:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
          nullable: true
        total_unread:
          type: integer
          minimum: 0
        categories:
          type: array
          items:
            type: object
            properties:
              category:
                $ref: '#/components/schemas/NotificationCategory'
              unread_count:
                type: integer
                minimum: 1
              latest:
                $ref: '#/components/schemas/Notification'
            required: [category, unread_count, latest]
      required: [project_id, total_unread, categories]
    Notification:
      type: object
      properties:
        id: *id001
        category:
          $ref: '#/components/schemas/NotificationCategory'
        title:
          type: string
        object_ref:
          type: object
          description: The object the notification is about, with the deep link that opens it (`url`,
            app-relative, e.g. `/projects/{id}/plan?task={taskId}&tab=tender`). `count` on a variation digest.
          properties:
            type:
              type: string
            id: *id001
            project_id: *id001
            url:
              type: string
            count:
              type: integer
          required:
          - type
          - id
          - url
        created_at: *id004
        read_at:
          oneOf:
          - *id004
          - type: 'null'
      required:
      - id
      - category
      - title
      - object_ref
      - created_at
    NotificationPreference:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/NotificationCategory'
        channel:
          type: string
          enum:
          - in_app
          - email
        enabled: *id002
    AuditEntry:
      type: object
      properties:
        seq:
          type: integer
          format: int64
        occurred_at: *id004
        category:
          type: string
        type:
          type: string
        actor:
          $ref: '#/components/schemas/Actor'
        object_type:
          type: string
        object_id: *id001
        payload:
          description: absent when redacted
        redacted: *id002
        entry_hash:
          type: string
        prev_hash:
          type: string
      description: 'V7: out-of-scope entries are redacted but keep their hashes.'
    ChainVerification:
      type: object
      properties:
        valid: *id002
        length:
          type: integer
        head:
          type: string
        first_invalid_seq:
          oneOf:
          - type: integer
          - type: 'null'
    Review:
      type: object
      properties:
        id: *id001
        reviewer_org_id: *id001
        subject_org_id: *id001
        anchor_type:
          type: string
          enum:
          - contract
          - subcontract_work
        anchor_id: *id001
        ratings:
          type: object
          properties:
            quality:
              type: integer
              minimum: 1
              maximum: 5
            schedule:
              type: integer
              minimum: 1
              maximum: 5
            communication:
              type: integer
              minimum: 1
              maximum: 5
            payment:
              type: integer
              minimum: 1
              maximum: 5
        body:
          type: string
        status:
          type: string
          enum:
          - submitted
          - published
        published_at: *id004
        reply:
          type: string
    ReviewEligibility:
      type: object
      properties:
        subject_org_id: *id001
        subject_name:
          type: string
        anchor_type:
          type: string
        anchor_id: *id001
        project_name:
          type: string
    PerformanceMetrics:
      type: object
      properties:
        on_time_rate:
          type: number
        first_pass_rate:
          type: number
        change_orders_per_contract:
          type: number
        median_answer_hours:
          type: number
        contracts_completed:
          type: integer
    Plan:
      type: object
      properties:
        code:
          type: string
        org_kind:
          type: string
        name:
          type: string
        price:
