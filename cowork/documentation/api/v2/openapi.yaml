        package (structure + quantities, no prices), the project name/locality, the invited email, and
        the bidder''s OWN proposal once submitted; never the issuer, the other recipients, or another
        lane (V8). An unknown, revoked, or expired token answers a uniform 404, so it is not an
        existence oracle.


        **Clerk permission:** none (token-authenticated)


        **Relationship (LinkNMS):** the invited recipient'
