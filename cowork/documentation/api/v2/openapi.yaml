    RfpWindow:
      type: object
      description: >-
        The governing RFP of a tendered row, as the plan/Gantt bridge paints it
        (LINA-413): which tender, its lifecycle status, when tendering opened and
        when bids are due. The "bids in / awarded" state the client derives from
        the lanes. No money, no counts.
      properties:
        id: *id001
        status:
          type: string
          enum:
          - draft
          - published
          - closed
          - awarded
          - cancelled
        opened_at:
          type: string
          format: date-time
          description: When the tender was opened (the draft's creation).
        submission_deadline:
          type: string
          format: date-time
          description: Bids due by this instant.
        awarded_proposal_id:
          allOf:
          - *id001
          description: Present once the tender is awarded.
      required:
      - id
      - status
      - submission_deadline
    TaskProcurement:
      type: object
      description: >-
        One tendered root task's procurement state for the plan (PRD-01 G-2/G-3,
        LINA-413), projected for the RFP's issuer. Raw lifecycle + counts; the
        grid folds them into its chip words. No money.
      properties:
        task_id:
          allOf:
          - *id001
          description: The tendered root task (the plan row's key).
        rfp_id: *id001
        title:
          type: string
          description: The RFP title — what a covered descendant's `↳ {RFP}` marker prints.
        status:
          type: string
          enum:
          - draft
          - published
          - closed
          - awarded
          - cancelled
        opened_at:
          type: string
          format: date-time
          description: When the tender was opened (the draft's creation).
        submission_deadline:
          type: string
          format: date-time
          description: Bids due by this instant.
        root_task_ids:
          type: array
          description: Every root task the governing RFP covers (their subtrees are its scope).
          items: *id001
        excluded_task_ids:
          type: array
          description: Descendants of the roots left out of the package — not covered.
          items: *id001
        published_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        awarded_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancel_reason:
          type: string
          nullable: true
          description: The issuer's reason when the governing tender was cancelled (T-19).
        invited_count:
          type: integer
          minimum: 0
          description: Bidders the tender went to — every lane, whatever its state.
        submitted_count:
          type: integer
          minimum: 0
          description: Lanes whose bid has landed (submitted, shortlisted or awarded).
        open_question_count:
          type: integer
          minimum: 0
          description: Clarifications on the governing RFP still waiting for the issuer's
            answer — the panel's Tender-tab badge (PRD-08 H-7).
        awarded_to:
          type: object
          nullable: true
          description: The winning bidder once awarded; null otherwise.
          properties:
            org_id:
              type: string
              format: uuid
              nullable: true
              description: Null for an off-platform (emailed) bidder that has no org yet.
            name:
              type: string
              description: The bidder org's legal name, else the invited email.
          required:
          - org_id
          - name
      required:
      - task_id
      - rfp_id
      - title
      - status
      - opened_at
      - submission_deadline
      - root_task_ids
      - invited_count
      - submitted_count
      - awarded_to
