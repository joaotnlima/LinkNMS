          - type: 'null'
    SignOffDecision:
      type: object
      description: Optional resolution comment carried on approve / reject.
      properties:
        comment:
          type: string
    Segment:
      type: object
      properties:
        kind:
          type: string
          enum:
          - baseline
          - current
          - extension
          - delay_start
          - actual
          - overrun
          - projected
        from: *id003
        to: *id003
        moved:
          type: boolean
          description: baseline only — true when the bar no longer sits on its baseline (the ghost is drawn
            only then, PRD-13 S-1).
        delta_wd:
          type: integer
          description: Working days the segment represents on the project calendar (extension, overrun,
            projected; a negative value on an 'actual' closed early). Labels never rely on colour alone (S-4).
        cause:
          type: string
          enum:
          - moved
          - pushed
          - not_closed
          - closed_late
          - closed_early
          - net
          description: 'Why the bar grew: moved (someone edited the finish), pushed (a linked task moved
            it), not_closed (overrun to today), closed_late / closed_early (actual finish vs baseline), net
            (a summary row''s roll-up).'
        cause_task_id: *id001
        by_org_id: *id001
      description: 'Render-ready bar segment (05 §5, PRD-13). ''extension'' is solid clay (status-pending-change);
        ''overrun'' (D-44) is a hatched clay segment from the current finish to today on a leaf that is not
        closed — computed, never stored, and present with or without a baseline (S-9); ''projected'' is
        the push an overrun would make on a linked successor — a projection only, no date is written.'
    Task:
      type: object
      properties:
        id: *id001
        project_id: *id001
        parent_id:
          oneOf:
          - *id001
          - type: 'null'
        depth:
          type: integer
          minimum: 1
          maximum: 10
        position:
          type: string
        kind:
          type: string
          enum:
          - task
          - summary
          - milestone
        name:
          type: string
        description:
          type: string
        specialty:
          type: string
        specialty_code:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: 'PRD-03 R-2: optional directory taxonomy code (listSpecialties); `specialty` stays the free-text
            label shown on the row'
        location_id: *id001
        assignee:
          type: object
          properties:
            org_id: *id001
            org_name:
              type: string
            person_id: *id001
            inherited: *id002
        dating_mode:
          type: string
          enum:
          - dated
          - undated
          - external
        start:
          oneOf:
          - *id003
          - type: 'null'
        finish:
          oneOf:
          - *id003
          - type: 'null'
        duration_wd:
          type: integer
        actual_start:
          oneOf:
          - *id003
          - type: 'null'
        actual_finish:
          oneOf:
          - *id003
          - type: 'null'
        baseline:
          oneOf:
          - type: object
            properties:
              start: *id003
              finish: *id003
              version:
                type: integer
              reason:
                type: string
                enum:
                - award
                - contract_signed
                - change_order
                description: when this baseline version was taken (D-43 award, D-13 signature, or a change
                  order)
              taken_at: *id004
          - type: 'null'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        baseline_delta_wd:
          type: integer
          description: 'PRD-13 S-5: working days between the baseline finish and the row''s effective finish
            (actual when closed; otherwise the planned finish, stretched to today while overrunning and
            to any projected push). Summary rows carry the net of their subtree. Absent without a baseline.'
        overrun_wd:
          type: integer
          description: 'D-44 / S-9: working days a leaf that is not closed has run past its current finish,
            up to today. Absent when not overrunning. Needs no baseline.'
        projected:
          type: object
          description: 'D-44: where an overrunning predecessor would push this row along its links. A projection
            only — the row''s stored dates are unchanged. Absent when nothing pushes it.'
          properties:
            start: *id003
            finish: *id003
            cause_task_id: *id001
        schedule_state:
          type: string
          enum:
          - planned
          - on_baseline
          - extended
          - sequence_warning
        status:
          type: string
          enum:
          - not_started
          - in_progress
          - blocked
          - done
          - verified
        is_critical:
          type: boolean
          description: 'On the critical path: a one-working-day slip of this leaf''s finish moves the project
            finish (rigid links, D-22; done rows never move), or — for a summary — it contains such a leaf. The
            server''s one rule, shared with the tender window''s critical alert (PRD-01, PRD-02 T-5).'
        acceptance_criteria:
          type: string
          description: 'One criterion per line (PRD-10 E-6). Baselined and tracked as scope like the scope text
            (doc 05 §5–6).'
        acceptance_checklist:
          type: array
          description: 'PRD-10 E-6, on `getTask`: `acceptance_criteria` as a checklist (one item per non-empty
            line, list markers removed). Absent when there are none.'
          items:
            type: string
        waiting_on:
          type: array
          description: 'PRD-10 E-5, on `getTask`: what the task waits on before it starts — each predecessor
            linked into its start, with its state and whether it is there yet. Absent when nothing is linked into
            its start.'
          items:
