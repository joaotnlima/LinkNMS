      summary: 'Rotate a recipient''s personal link (gap S1): mint a fresh token, kill the old'
      description: 'A personal RFP link is an anonymous bearer credential, so a leak — a forwarded
        email, a screenshot, a logged page URL — hands a stranger the bidder''s access. This rotates
        it: a fresh 32-byte token is minted and the old `token_hash` is overwritten in place, so the
        old link stops resolving the instant this commits (`findRecipientByToken` no longer matches
        it). `expires_at` is refreshed from the RFP''s current deadline and `revoked_at` is cleared.
