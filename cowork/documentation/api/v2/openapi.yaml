      operationId: submitProposalByToken
      summary: 'RFP personal link: submit a proposal (gap S1, anonymous, single-use)'
      description: 'The bidder submits a summary proposal (total, duration, conditions, documents;
        no priced BoQ) through the personal link. Anonymous — the token authenticates it (global
        security overridden to none). Single-use: the auto-created lane starts `invited`; this moves
        it to `submitted` and is guarded on that state, so a second POST answers 409 and the GET
        afterwards returns the confirmation view. The window can close between load and submit — a
        closed RFP answers 409 rather than landing a bid nobody reads. A refusal never distinguishes
        an unknown token from a dead one (uniform 404).


        **Clerk permission:** none (token-authenticated)


        **Relationship (LinkNMS):** the invited recipient'
