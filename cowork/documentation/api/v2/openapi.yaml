      tags:
      - Project
      operationId: closeProject
      summary: Close (all owner-level contracts closed/terminated)
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** project.owner'
      x-relationship: project.owner
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /projects/{projectId}/overview:
    get:
      tags:
      - Project
      operationId: getProjectOverview
      summary: 'Owner control view: end date and cost vs baseline, open variations/questions, health'
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** project.participant


        **MCP tool:** `project_status`'
      x-relationship: project.participant
      x-mcp-tool: project_status
      x-mcp-mode: read
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOverview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/locations:
    get:
      tags:
      - Project
      operationId: listLocations
      summary: Buildings / units / zones
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** project.participant'
      x-relationship: project.participant
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Location'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Project
      operationId: createLocation
      summary: Add a building / unit / zone
      description: '**Clerk permission:** `org:plan:edit`


        **Relationship (LinkNMS):** project.owner


        **MCP tool:** `add_location`'
      x-clerk-permission: org:plan:edit
      x-relationship: project.owner
      x-mcp-tool: add_location
      x-mcp-mode: write-confirm
      parameters:
      - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /locations/{locationId}:
    patch:
      tags:
      - Project
      operationId: updateLocation
      summary: Edit a location
      description: '**Clerk permission:** `org:plan:edit`


