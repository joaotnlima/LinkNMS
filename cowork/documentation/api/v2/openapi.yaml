  /projects/{projectId}/events:stream:
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Realtime
      operationId: streamEvents
      summary: 'Server-Sent Events: row deltas, propagation, variations, presence (projected per viewer)'
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** project.participant


        Connecting registers the viewer''s presence on the project (broadcast as a `presence` event);
        disconnecting clears it — there is no separate heartbeat operation. Events use the envelope of
        doc 10 (`10-domain-events.md`), projected per viewer; `event:` carries the event name, `id:`
        the envelope id for resume.'
      x-relationship: project.participant
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
        description: Resume the stream after this envelope id; replayed events are re-projected against the viewer's CURRENT visibility, never the historical one.
      responses:
        '200':
          description: text/event-stream of projected event envelopes
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
