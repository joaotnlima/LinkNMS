      operationId: reportProgress
      summary: Report progress (append-only; done → verification request)
      description: '**Clerk permission:** `org:progress:report`


        **Relationship (LinkNMS):** edit scope ∋ row


        **D-48 gate:** `done` is refused with 409 `invalid_transition` (`reason: deliverables_pending`,
        `pending_deliverable_ids[]`) while a required deliverable of the task is not approved (see
        `listTaskDeliverables`).


        **Start out of sequence (PRD-10 E-5, D-48 — warn and record, D-23):** starting a task that has not
        started yet (`in_progress`, `blocked` or `done` on a task whose latest status is `not_started`) while a
        predecessor it waits on is not there yet is refused with 409 `invalid_transition` (`reason:
        predecessors_open`, `waiting_on[]` — each predecessor with its state) unless the report carries an
        `override_reason`. With one, the report is accepted and records the override (`out_of_sequence`: the
        reason and the predecessors as they stood), in the ledger entry and on the `planning.progress.reported`
        event. A task waits on the predecessors of its links into its **start**: a link from the predecessor''s
        end needs it closed (done, verified or an actual finish); a link from its start needs it started.


        **Acceptance criteria (PRD-10 E-6):** `done` may carry `criteria_met` — the criteria of the task''s
        checklist (`acceptance_checklist`) that were met. The report records the whole checklist with `met`
        per criterion (`acceptance`); a criterion not on the checklist is 422. For design tasks the acceptance
        is the deliverables gate above (PRD-05).


        **MCP tool:** `report_progress`'
