    ScheduleImportField:
      type: string
      description: 'The import''s target fields (flows/01 Excel contract). Required: `action`, `start`, and
        `end` or `duration` (working days).'
      enum:
      - action
      - sub_action
      - start
      - end
      - duration
      - trade
      - dependency
    ScheduleImportMapping:
      type: object
      description: The sheet and, per field, the 0-based column index it reads (absent = not imported).
      properties:
        sheet:
          type: string
        mapping:
          type: object
          properties:
            action: {type: integer, minimum: 0}
            sub_action: {type: integer, minimum: 0}
            start: {type: integer, minimum: 0}
            end: {type: integer, minimum: 0}
            duration: {type: integer, minimum: 0}
            trade: {type: integer, minimum: 0}
            dependency: {type: integer, minimum: 0}
      required: [sheet, mapping]
    ScheduleImportWarning:
      type: object
      properties:
        row:
          type: integer
          description: The sheet row number (1-based, as Excel shows it).
        field:
          $ref: '#/components/schemas/ScheduleImportField'
        code:
          type: string
          enum: [bad_date, end_before_start, no_end, no_start, unknown_dependency, self_dependency, dependency_cycle, no_action, bad_duration]
        message:
          type: string
      required: [row, code, message]
    ScheduleImportRow:
      type: object
      description: One parsed sheet row.
      properties:
        row: {type: integer}
        action: {type: string, nullable: true}
        sub_action: {type: string, nullable: true}
        start: {type: string, format: date, nullable: true}
        finish: {type: string, format: date, nullable: true}
        duration_wd: {type: integer, nullable: true}
        trade: {type: string, nullable: true}
        specialty_code: {type: string, nullable: true, description: 'O-11: the taxonomy code the trade matched, if any.'}
        dependency: {type: string, nullable: true}
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleImportWarning'
    ScheduleImportNode:
      type: object
      description: A row of the WBS the import will write — an action (with `children`) or a sub-action.
      properties:
        key: {type: string, description: 'Stable within the import (`a{n}` / `a{n}.{m}`).'}
        row: {type: integer}
        name: {type: string}
        start: {type: string, format: date, nullable: true}
        finish: {type: string, format: date, nullable: true}
        trade: {type: string, nullable: true}
        specialty_code: {type: string, nullable: true}
        depends_on:
          type: array
          items: {type: string}
          description: Keys of the rows this one starts after (end→start links).
        children:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleImportNode'
    ScheduleImport:
      type: object
      properties:
        id: *id001
        project_id: *id001
        status:
          type: string
          enum:
          - uploaded
          - mapped
          - previewed
          - confirmed
          - failed
        filename:
          type: string
        sheets:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              rows: {type: integer, description: Data rows below the header (0 = empty or header-only).}
              columns: {type: integer}
            required: [name, rows, columns]
        sheet:
          type: string
          nullable: true
          description: The sheet the mapper runs against.
        columns:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              header:
                type: string
              samples:
                type: array
                items:
                  type: string
        mapping:
          type: object
          description: The saved mapping (field → column index), or the suggestion from the headers until the
            person maps (`mapping_suggested` true).
        mapping_suggested:
          type: boolean
        missing_required:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleImportField'
        sample:
          type: array
          description: The first 10 parsed rows (on `:map` and later).
          items:
            $ref: '#/components/schemas/ScheduleImportRow'
        tree:
          type: array
          description: The WBS to be written (on `:preview` and later).
          items:
            $ref: '#/components/schemas/ScheduleImportNode'
        counts:
          type: object
          properties:
            rows: {type: integer}
            actions: {type: integer}
            sub_actions: {type: integer}
            links: {type: integer}
            trades: {type: integer}
            warnings: {type: integer}
        preview:
          type: array
          description: Deprecated — the earlier draft of this contract; never answered. See `tree`.
          deprecated: true
          items:
            $ref: '#/components/schemas/TaskCreate'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleImportWarning'
        plan_exists:
          type: boolean
          description: The plan already has rows — confirm will answer 409 plan_not_empty (O-9).
        imported_by:
          type: object
          properties:
            org_id: *id001
            org_name: {type: string}
        confirmed_at:
          type: string
          format: date-time
          nullable: true
    Rfp:
      type: object
      properties:
        id: *id001
        project_id: *id001
        issuer_org_id: *id001
        level:
          type: string
          enum:
          - owner
          - sub
        purpose:
          type: string
          description: 'D-39: design (pre-construction, a service) vs execution (the
            as-is, built work priced as a BoQ).'
          enum:
          - design
          - execution
        mode:
          type: string
          description: 'Bid shape: light = fee lump-sum + portfolio + references +
            PDF (no BoQ); detailed = priced BoQ. A design RFP is always light.'
          enum:
          - light
          - detailed
        parent_contract_id: *id001
        root_task_ids:
          type: array
          items: *id001
        title:
          type: string
        scope_text:
          type: string
        specialties:
          type: array
          items:
            type: string
        visibility:
          type: string
          deprecated: true
          description: 'Deprecated by `listed` (D-47, PRD-04): kept in step with it — `open` ⇔
            `listed = true`.'
          enum:
          - invite_only
          - open
        listed:
          type: boolean
          description: 'D-47 / PRD-04 X-3: also listed as an OPEN REQUEST — companies whose
            specialty and service area match see it in their inbox and can ask to bid. Nobody gets
            a link until the issuer approves.'
        specialty_codes:
          type: array
          description: 'The directory taxonomy codes of the package rows (planning
            `task.specialty_code`, PRD-03 R-2) — what open requests are matched on.'
          items:
            type: string
        questions_deadline: *id004
        submission_deadline: *id004
        package_version:
          type: integer
        status:
          type: string
          enum:
          - draft
          - published
          - closed
          - awarded
          - cancelled
        excluded_task_ids:
          type: array
          description: 'Descendants of the roots LEFT OUT of the package (e.g. already
            assigned to another party, PRD-02 T-3). The package is the roots'' sub-trees
            minus these rows and their own sub-trees.'
          items: *id001
        created_at:
          type: string
          format: date-time
          description: When the draft was created (the stepper's Draft date).
        published_at:
          type: string
          format: date-time
          nullable: true
          description: When it was sent (publishRfp).
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: When bidding closed (early or at the deadline).
        awarded_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancel_reason:
          type: string
          description: The issuer's one-line reason, when cancelled with one (T-19).
        awarded_proposal_id: *id001
        version:
          type: integer
        package:
          type: object
          description: 'Response-only, on getRfp: the current package version — subtree
            structure and BoQ quantities, never prices (doc 05 §10).'
          properties:
            rows:
              type: array
              items:
                type: object
                properties:
                  task_id: *id001
                  parent_task_id: *id001
                  name:
                    type: string
                  scope_text:
                    type: string
                  specialty:
                    type: string
                  position:
                    type: string
            items:
              type: array
              items:
                type: object
                properties:
                  rfp_item_id: *id001
                  task_id: *id001
                  code:
                    type: string
                  description:
                    type: string
                  unit:
                    type: string
                  quantity:
                    type: string
                  material_spec:
                    type: string
                  specialty:
                    type: string
            models:
              type: array
              items:
                $ref: '#/components/schemas/RfpModel'
        clarifications:
          type: array
          description: 'Response-only, on getRfp: askers anonymised; a bidder sees
            answered questions and its own open ones. Answers are public to every
            bidder of the RFP and form part of its package (PRD-08 H-8).'
          items:
            $ref: '#/components/schemas/Clarification'
        questions_open:
          type: boolean
          description: 'Response-only, on getRfp and listProjectRfps: whether a bidder
            may still ask — the RFP is published and its `questions_deadline` (if any)
            has not passed. Computed server-side; askClarification enforces the same
            rule (PRD-08 H-9).'
    RfpModel:
      type: object
      description: 'The build''s model as an RFP shows it. snake_case per doc 11; the camelCase twins
        (`documentId`, `fileName`, `sizeBytes`, `currentVersion`) are deprecated and carry the same values.'
      properties:
        document_id: { type: string, format: uuid }
        version: { type: integer }
        file_name: { type: string }
        mime: { type: string }
        size_bytes: { type: integer }
        sha256: { type: string, nullable: true }
        pinned: { type: boolean, description: 'PRD-07: true when the RFP is pinned to `version`; false when it follows the current version' }
        current_version: { type: integer, description: 'PRD-07: the build model''s current version' }
        documentId: { type: string, format: uuid, deprecated: true, description: 'Deprecated: use `document_id`.' }
        fileName: { type: string, deprecated: true, description: 'Deprecated: use `file_name`.' }
        sizeBytes: { type: integer, deprecated: true, description: 'Deprecated: use `size_bytes`.' }
        currentVersion: { type: integer, deprecated: true, description: 'Deprecated: use `current_version`.' }
      required: [document_id, version, file_name, mime, size_bytes]
    Award:
      type: object
      properties:
        proposal_id: *id001
        note:
          type: string
      required:
      - proposal_id
      description: The winning proposal. Award creates the contract draft (origin
        award); losing live lanes become declined.
    RfpCreate:
      type: object
      properties:
        id: *id001
        root_task_ids:
          type: array
          items: *id001
        title:
          type: string
        scope_text:
          type: string
        visibility:
          type: string
          deprecated: true
          description: 'Deprecated by `listed`; `open` is read as `listed: true`. When both are
            sent, `listed` wins.'
          enum:
          - invite_only
          - open
        listed:
          type: boolean
          description: Also list it as an open request (D-47, PRD-04 X-3). Default false.
        purpose:
          type: string
          description: 'D-39. Omit for the as-is execution tender; design pins the
            RFP light.'
          enum:
          - design
          - execution
        mode:
          type: string
          enum:
          - light
          - detailed
        excluded_task_ids:
          type: array
          description: Descendants of the roots to leave out of the package (each with its
            own sub-tree). Must lie inside a root's sub-tree. Draft-only on update.
          items: *id001
        questions_deadline: *id004
        submission_deadline:
          type: string
          format: date-time
          description: 'Bids due. Omitted → the server''s default: 14 calendar days out, 18:00 Lisbon time (the
            issuer changes it before publishing).'
      required:
      - id
      - root_task_ids
      - title
    RecipientAdd:
      type: object
      properties:
        recipients:
          type: array
          items:
            type: object
            description: 'Exactly one of `company_id` (a directory profile — PRD-04 X-1, X-6:
              source `directory`; an unclaimed profile is invited at its e-mail), `org_id` (a
              platform organisation: source `directory`) or `email` (source `email`; with
              `org_id`, the address to use).'
            properties:
              company_id:
                type: string
                format: uuid
                description: The directory profile's id (`DirectoryCard.org_id`).
              org_id: *id001
              email:
                type: string
                format: email
      required:
      - recipients
      description: Each recipient receives an individual email with a personal link (D-29). Never CC/BCC.
    Recipient:
      type: object
      properties:
        id: *id001
        org_id:
          type: string
          format: uuid
          description: 'The company (PRD-04 §5 `company_id`): the bidder organisation. Absent for an
            invite to an address no organisation holds yet; back-filled when that address''s
            unclaimed directory profile is claimed.'
        email:
          type: string
          format: email
        source:
          type: string
          description: 'Where the bidder came from (PRD-04 §3): `directory` (added from the search
            or a profile), `email` (typed by the issuer), `asked_to_bid` (an approved request to
            bid on a listed RFP).'
          enum:
          - directory
          - email
          - asked_to_bid
        company_name:
          type: string
          description: The directory display name when added from the directory (a snapshot).
        status:
          type: string
          enum:
          - queued
          - sent
          - opened
          - declined
          - proposal_submitted
          - bounced
        sent_at: *id004
        opened_at: *id004
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 'When this personal link lapses (gap S1, LINA-373): the RFP''s
            submission deadline plus a 14-day proposal-validity window. Past this, the
            token resolves to a uniform 404. A re-issue refreshes it.'
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: 'Set when the link was explicitly killed; a re-issue clears it. A
            revoked or expired token answers the same 404 as an unknown one (no oracle).'
        token:
          type: string
          description: 'Response-only, ONCE, in the addRecipients 201 and the reissue 200:
            the raw personal-link token (only its SHA-256 is stored). The invite is also
            emailed through the MailSender port (LINA-412) with the token ONLY in the body;
            this echo lets the issuer re-send manually. Same rationale as
            ProjectInvitation.token.'
      description: Visible to the issuer only.
    CompanyProof:
      type: object
      description: 'A company as the directory shows it (PRD-03, D-46), read through the directory''s
        published port: never an amount, never stated data presented as checked.'
      properties:
        org_id: *id001
        display_name:
          type: string
        slug:
          type: string
        claimed:
          type: boolean
        verified_clients:
          type: integer
        builds:
          type: integer
        tasks_finished:
          type: integer
        tasks_on_time:
          type: integer
        distance_km:
          type: number
          description: From the RFP's build to the company's base, when both are known.
      required:
      - org_id
      - display_name
      - claimed
      - verified_clients
      - builds
      - tasks_finished
      - tasks_on_time
    BidRequest:
      type: object
      description: 'A company''s request to bid on a listed RFP (D-47, PRD-04 X-13). The issuer
        sees `company`; the asking company sees its own request.'
      properties:
        id: *id001
        rfp_id: *id001
        org_id: *id001
        status:
          type: string
          enum:
          - pending
          - approved
          - declined
        requested_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by_person_id:
          type: string
          format: uuid
          description: Issuer side only.
        recipient_id:
          type: string
          format: uuid
          description: The invite approval created or adopted.
        company:
          $ref: '#/components/schemas/CompanyProof'
      required:
      - id
      - rfp_id
      - org_id
      - status
      - requested_at
    CompanyRequest:
      type: object
      description: One invite in the company inbox — "Requests for you" (PRD-04 X-9).
      properties:
        rfp_id: *id001
        recipient_id: *id001
        title:
          type: string
        origin:
          type: string
          description: '`directory` — found you in the directory; `email` — invited by email;
            `asked_to_bid` — you asked and the issuer approved.'
          enum:
          - directory
          - email
          - asked_to_bid
        issuer_level:
          type: string
          description: '`owner` — from the owner; `sub` — from a general contractor.'
          enum:
          - owner
          - sub
        build:
          type: object
          properties:
            name:
              type: string
            municipality_code:
              type: string
        rfp_status:
          type: string
          enum:
          - published
          - closed
          - awarded
          - cancelled
        submission_deadline: *id004
        task_count:
          type: integer
          description: Rows in the current package version.
        file_count:
          type: integer
          description: 'Files the package carries for the bidder: today the build''s model when
            the RFP references one (0 or 1). Task files are the Documents module''s and are not
            counted here.'
        invitation_status:
          type: string
          enum:
          - queued
          - sent
          - opened
          - declined
          - proposal_submitted
          - bounced
        proposal_id: *id001
        proposal_status:
          type: string
        awarded_to_me:
          type: boolean
        received_at:
          type: string
          format: date-time
      required:
      - rfp_id
      - recipient_id
      - title
      - origin
      - issuer_level
      - rfp_status
      - submission_deadline
      - task_count
      - file_count
      - invitation_status
    OpenRequest:
      type: object
      description: A listed RFP matching the company — "Open requests near you" (PRD-04 X-10).
      properties:
        rfp_id: *id001
        title:
          type: string
        issuer_level:
          type: string
          enum:
          - owner
          - sub
        build:
          type: object
          properties:
            name:
              type: string
