      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [project, rfp, recipient_email, closed, proposal, questions_open, clarifications]
                properties:
                  project:
                    type: object
                    required: [name, location]
                    properties:
                      name: { type: string }
                      location: { type: string, nullable: true }
                  rfp:
                    type: object
                    required: [title, specialties, purpose, mode, submission_deadline, package]
                    properties:
