    InviteEmailPreview:
      type: object
      description: 'The rendered invite email (LINA-412, previewInviteEmail). The secure link in
        the body is a non-secret placeholder — a preview never carries a live token (LINA-373).'
      properties:
        to:
          type: string
          format: email
          description: The sample recipient the preview is addressed to.
        subject:
          type: string
        html:
          type: string
          description: The HTML body; carries only the placeholder link, never a live token.
        text:
          type: string
          description: The plain-text body; carries only the placeholder link, never a live token.
      required:
      - to
      - subject
      - html
      - text
    Clarification:
      type: object
      properties:
        id: *id001
        question:
          type: string
        answer:
          type: string
        status:
          type: string
          enum:
          - open
          - answered
        answered_at: *id004
        asked_at:
          type: string
          format: date-time
          readOnly: true
          description: When the question was asked.
        mine:
          type: boolean
          readOnly: true
          description: 'Response-only: true when the viewer (org, or the personal-link
            recipient) asked it — lets a bidder tell its own open question apart. Never
            identifies another asker (PRD-08 H-7).'
      description: The asker is never exposed to other bidders (nor on the wire at all).
    ProjectRfp:
      description: 'One RFP of a project as the tendering home lists it (PRD-08 H-1): the
        Rfp plus the viewer''s relation to it and the counts the home prints. Issuer-only
        facts (`invited_count`, `submitted_count`, `open_question_count`, `awarded_to`)
        are ABSENT for a bidder (V8: a bidder never learns how many others bid). No money.'
      allOf:
      - $ref: '#/components/schemas/Rfp'
      - type: object
        properties:
          viewer_role:
            type: string
            enum:
            - issuer
            - bidder
          covers:
            type: array
            description: The root tasks the RFP tenders, named from its package snapshot.
            items:
              type: object
              properties:
                task_id: *id001
                name:
                  type: string
              required:
              - task_id
              - name
          covered_task_count:
            type: integer
            minimum: 0
            description: Rows in the current package (roots and kept descendants).
          invited_count:
            type: integer
            minimum: 0
            description: Issuer only. Every lane, whatever its state (the `m` of `n/m in`).
          submitted_count:
            type: integer
            minimum: 0
            description: Issuer only. Lanes whose bid has landed (the `n` of `n/m in`).
          open_question_count:
            type: integer
            minimum: 0
            description: Issuer only. Clarifications still waiting for an answer.
          awarded_to:
            type: object
            nullable: true
            description: Issuer only. The winning bidder once awarded.
            properties:
              org_id:
                type: string
                format: uuid
                nullable: true
              name:
                type: string
          my_proposal:
            type: object
            nullable: true
            description: Bidder only. The viewer org's own lane on this RFP.
            properties:
              id: *id001
              status:
                type: string
        required:
        - viewer_role
        - covers
        - covered_task_count
        - questions_open
    ProposalLane:
      type: object
      properties:
        proposal_id: *id001
        bidder:
          type: object
          properties:
            org_id: *id001
            name:
