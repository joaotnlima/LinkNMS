openapi: 3.1.0
info:
  title: LinkNMS API
  version: 2.0.0-stub
  description: 'Contract-first stub of the to-be API. **Source of truth for the UI and for the MCP server.** Behaviour is
    specified in `cowork/documentation/to-be/` (05 plan, 06 tendering, 04/16 access). Every operation states the Clerk permission
    it needs (`x-clerk-permission`), the relationship LinkNMS checks (`x-relationship`) and, when exposed to agents, its MCP
    tool name (`x-mcp-tool`).


    Conventions (to-be/11): acting org = Clerk active organization; money in integer cents EUR; ids UUIDv7 (client-generated
    on create); fields the viewer may not read are absent (see `_visibility`); plan rows use field-level deltas with last-write-wins;
    other aggregates use If-Match.'
  contact:
    name: LinkNMS
servers:
- url: https://portal.linknms.com/api/v2
  description: production
- url: https://dev.portal.linknms.com/api/v2
  description: dev
- url: http://localhost:3000/api/v2
  description: local
security:
- clerkSession: []
tags:
- name: Identity & Access
  description: Clerk owns people, organisations, roles and permissions; LinkNMS mirrors them for attribution. See to-be/16.
- name: Directory
  description: Company profiles, specialties, service areas, portfolio. See to-be/07.
- name: Project
  description: 'The build: brief, locations, participants, calendar, share links. See to-be/03.'
- name: Planning
  description: 'The plan (WBS + timeline): rows, links, propagation, baselines, variations, progress, templates. See to-be/05.'
- name: Tendering
  description: RFP from plan rows, individual invitations, proposal lanes, comparison, award. See to-be/06.
- name: Contracting
  description: Contract tree, change orders (optional formalisation), measurements, payment records. See to-be/06.
- name: Quality
  description: Verification of completed work, non-conformities, inspections. See to-be/08, 17.
- name: Documents
  description: Versioned, scoped files; sha256 in the ledger. See to-be/08.
- name: Collaboration
  description: Comments, questions, minutes, activity, notifications. See to-be/08.
- name: Record
  description: Tamper-evident, hash-chained ledger, projected per viewer. See to-be/08.
- name: Reputation
  description: Reviews after completion + objective metrics. See to-be/07.
- name: Billing
  description: Plans, subscriptions, entitlements, sponsorship. See to-be/07, 16 §9.
- name: Realtime
  description: Live stream per project. See to-be/11.
paths:
  /me:
    get:
      tags:
      - Identity & Access
      operationId: getMe
      summary: 'Who am I: person, active org, role, permissions, orgs, pending project invitations'
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** none


        **MCP tool:** `whoami`'
      x-mcp-tool: whoami
      x-mcp-mode: read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/profile:
    put:
      tags:
      - Identity & Access
      operationId: updateMyProfile
      summary: Edit my own display name and language (first-login account setup)
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** none — you only ever edit your own person'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                locale:
                  type: string
                  enum:
                  - pt-PT
                  - en
                  - es
              required:
              - name
              - locale
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /organizations:
    post:
      tags:
      - Identity & Access
      operationId: createOrganization
      summary: Create my company or household (creates the Clerk org and its role set)
      description: '**Clerk permission:** none beyond an authenticated session


        **Relationship (LinkNMS):** none'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /organizations/{orgId}/members:
    parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Identity & Access
      operationId: listMembers
      summary: Members of my organisation (mirror of Clerk memberships)
      description: '**Clerk permission:** `org:members:manage`


        **Relationship (LinkNMS):** none'
      x-clerk-permission: org:members:manage
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Member'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{orgId}/invitations:
    parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Identity & Access
      operationId: inviteMember
      summary: Invite a colleague into my organisation with a catalogue role (Clerk organisation invitation)
      description: '**Clerk permission:** `org:members:manage`


        **Relationship (LinkNMS):** none — your own organisation only (403 otherwise)


        **Entitlement:** `seats` (402 `not_entitled` when the plan''s seat limit is reached; D-05, doc 16 §10)


        **Human-only:** never exposed as an MCP tool (a person must do this in the UI).


        Clerk sends and tracks the invitation (doc 16 §2). The catalogue role must belong to the org kind''s role
        set (doc 16 §4, 422 otherwise); on the free tier it rides on the invitation''s `public_metadata.org_role`
        and the membership webhook mirrors it on acceptance (D-38). PRD-12 N-9.'
      x-clerk-permission: org:members:manage
      x-human-only: true
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                org_role:
                  $ref: '#/components/schemas/OrgRole'
              required:
              - email
              - org_role
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /organizations/{orgId}/members/{personId}:
    parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Identity & Access
      operationId: updateMemberRole
      summary: Change a colleague's catalogue role (Clerk membership + mirror)
      description: '**Clerk permission:** `org:members:manage`


        **Relationship (LinkNMS):** none — your own organisation only


        **Human-only:** never exposed as an MCP tool (a person must do this in the UI).


        The role must be in the org kind''s role set (422). The last admin cannot be demoted (409
        `invalid_transition`). Clerk holds `org:admin` for admins and `org:member` + `public_metadata.org_role`
        for every finer role (D-38); the mirror is written at once and converges with the webhook.
        Permissions follow at the next token refresh (doc 16 §8). PRD-12 N-9.'
      x-clerk-permission: org:members:manage
      x-human-only: true
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/personId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                org_role:
                  $ref: '#/components/schemas/OrgRole'
              required:
              - org_role
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - Identity & Access
      operationId: removeMember
      summary: Remove a colleague from my organisation (Clerk membership deleted; staffing cleared by the webhook)
      description: '**Clerk permission:** `org:members:manage`


        **Relationship (LinkNMS):** none — your own organisation only


        **Human-only:** never exposed as an MCP tool (a person must do this in the UI).


        The last admin cannot be removed (409 `invalid_transition`). Past actions stay attributed in the
        ledger (doc 16 §8). PRD-12 N-9.'
      x-clerk-permission: org:members:manage
      x-human-only: true
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/personId'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/staffing/{personId}:
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      tags:
      - Identity & Access
      operationId: staffPerson
      summary: Put one of my people on a project
      description: '**Clerk permission:** `org:projects:staff`


        **Relationship (LinkNMS):** project.participant'
      x-clerk-permission: org:projects:staff
      x-relationship: project.participant
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/personId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staffing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - Identity & Access
      operationId: unstaffPerson
      summary: Remove one of my people from a project
      description: '**Clerk permission:** `org:projects:staff`


        **Relationship (LinkNMS):** project.participant'
      x-clerk-permission: org:projects:staff
      x-relationship: project.participant
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/personId'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /webhooks/clerk:
    post:
      tags:
      - Identity & Access
      operationId: clerkWebhook
      summary: 'Clerk webhook: user.*, organization.*, organizationMembership.* → identity mirror'
      description: 'Svix-signed (svix-id / svix-timestamp / svix-signature headers verified against
        CLERK_WEBHOOK_SIGNING_SECRET; ±5 min timestamp tolerance). No Clerk session: this endpoint
        is called by Clerk, not by a user, so the global security requirement is overridden to none.
        Rejects deleting an org that is party to a signed contract.


        **Clerk permission:** none (machine caller)


        **Relationship (LinkNMS):** none'
      x-clerk-permission: none
      security: []
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '402':
          $ref: '#/components/responses/NotEntitled'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /organizations/{orgId}/profile:
    parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Directory
      operationId: getMyProfile
      summary: My public profile as I edit it (PRD-03 R-20)
      description: 'The editor''s view of the active organisation''s directory profile: every stated field, the slug,
        the `version` for If-Match, `completeness` and `listed`. 404 until the first `putProfile`.


        **Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** the profile is the active organisation''s (`orgId` = active org)'
      x-clerk-permission: org:profile:manage
      x-mcp-tool: get_my_company_profile
      x-mcp-mode: read
      parameters:
      - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Directory
      operationId: putProfile
      summary: Create or edit my public profile — specialties, base and radius, availability, stated credentials (PRD-03
        R-3, R-20)
      description: 'Creates the profile on the first call (no If-Match; the slug is minted from the display name, see
        to-be/20 §5.2) and replaces the stated fields afterwards (If-Match = `version`, 409 `version_conflict` when
        stale). `specialties` are taxonomy codes (`listSpecialties`); `tags` are free text. Credentials are **stated**
        (D-17 as amended by D-46): stored and shown as written, never checked. Completeness is recomputed and returned;
        it never changes the order of search results (D-46).


        **Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** `orgId` = active org; household organisations have no listing (403)'
      x-clerk-permission: org:profile:manage
      parameters:
      - $ref: '#/components/parameters/orgId'
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
        description: Current `version`; required once the profile exists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationProfileWrite'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfile'
        '201':
          description: Created (first save)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /organizations/{orgId}/profile/completeness:
    parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Directory
      operationId: getCompleteness
      summary: Completeness checklist and score (PRD-03 R-19)
      description: 'What the profile has and what is missing: specialties, base location and radius, description, licence,
        insurance, portfolio, availability. Shown to the company only; it never changes the order of results (D-46).


        **Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** `orgId` = active org'
      x-clerk-permission: org:profile:manage
      parameters:
      - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completeness'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{orgId}/listing-stats:
    parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Directory
      operationId: getListingStats
      summary: Your listing over the last 30 days (PRD-03 R-17)
      description: 'Times shown in search results, profile views (both counted by the directory, never from the
        company''s own organisation), proposals sent and proposals awarded (from tendering events). Requests received
        arrive with PRD-04.


        **Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** `orgId` = active org'
      x-clerk-permission: org:profile:manage
      x-mcp-tool: get_listing_stats
      x-mcp-mode: read
      parameters:
      - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingStats'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{orgId}/portfolio:
    parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Directory
      operationId: listMyPortfolio
      summary: My portfolio entries, as I edit them (PRD-03 R-13)
      description: 'Every entry of the active organisation, listed or not: `declared` (stated) and `platform` (on the
        record; public only with the owner''s consent).


        **Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** `orgId` = active org'
      x-clerk-permission: org:profile:manage
      x-mcp-tool: list_my_portfolio
      x-mcp-mode: read
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/PortfolioEntry'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags:
      - Directory
      operationId: addPortfolioEntry
      summary: Add a stated portfolio entry (PRD-03 R-13)
      description: 'A `declared` entry, labelled "Stated". Entries from a LinkNMS build (`source: platform`, shown
        only with the owner''s consent) are not generated yet. Photos are not accepted yet: a public photo needs a
        public document scope in Documents, which does not exist.


        **Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** `orgId` = active org, with a profile'
      x-clerk-permission: org:profile:manage
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioEntryWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /organizations/{orgId}/portfolio/{entryId}:
    parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      tags:
      - Directory
      operationId: deletePortfolioEntry
      summary: Remove a stated portfolio entry
      description: 'Only `declared` entries; a `platform` entry belongs to the record (409 `invalid_transition`).


        **Clerk permission:** `org:profile:manage`


        **Relationship (LinkNMS):** `orgId` = active org'
      x-clerk-permission: org:profile:manage
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/entryId'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /directory/organizations:
    get:
      tags:
      - Directory
      operationId: searchOrganizations
      summary: 'Find companies: specialty, near a build or a point, radius, can start by, facets (PRD-03 R-4..R-7, D-46)'
      description: 'Public (`security: []`); `near_project` additionally needs a session whose organisation takes part in
        that build (404 otherwise).


        **Where.** `near_project` (the build''s point, R-3) or `lat`+`lng` give distances: only companies whose base
        lies within `radius_km` of the point **and** whose own service radius reaches it are returned. `municipality` /
        `district` (INE codes) without a point match the base municipality or a listed service area — no distance.


        **Order (D-46).** Ranked companies first: those with at least one client verified by the platform (a client that
        signed a contract with them on LinkNMS). Among them: verified clients (desc), then the on-time rate of the tasks
        they finished under those contracts (smoothed (x+1)/(y+2), desc), then builds (desc), then distance, then
        specialty match. Then every company with no verified client yet (`record.ranked = false`), by distance, then
        specialty match. Completeness, stated data and payment never change the order. No promoted placement exists yet.


        **Facets** count the result set before the facet filters (`work_type`, `proof`, `size`, `claimed`) are applied.


        **Clerk permission:** none (public)


        **Relationship (LinkNMS):** `near_project` → project.participant


        **MCP tool:** `find_companies`'
      x-clerk-permission: none
      x-mcp-tool: find_companies
      x-mcp-mode: read
      security: []
      parameters:
      - name: specialty
        in: query
        required: false
        schema:
          type: string
        description: Taxonomy code; matches the code, its parent and its children
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
        description: Text in the company name
      - name: near_project
