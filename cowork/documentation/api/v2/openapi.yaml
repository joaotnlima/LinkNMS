                      scope_text: { type: string }
                      specialties: { type: array, items: { type: string } }
                      purpose: { type: string, enum: [design, execution], description: 'D-39: the tender purpose, so the form can label the bid.' }
                      mode: { type: string, enum: [light, detailed], description: 'The bid shape the form must render (light = fee + references, detailed = BoQ).' }
                      submission_deadline: { type: string, format: date-time }
                      questions_deadline: { type: string, format: date-time, description: 'When asking closes (PRD-08 H-9); absent when the issuer set none.' }
                      package:
                        type: object
                        description: Subtree structure and BoQ quantities, never prices (doc 05 §10).
                        properties:
                          rows:
                            type: array
                            items:
                              type: object
                              properties:
                                task_id: { type: string, format: uuid }
                                parent_task_id: { type: string, format: uuid }
                                name: { type: string }
                                scope_text: { type: string }
                                specialty: { type: string }
                                position: { type: string }
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                rfp_item_id: { type: string, format: uuid }
                                task_id: { type: string, format: uuid }
                                code: { type: string }
                                description: { type: string }
                                unit: { type: string }
                                quantity: { type: string }
                                material_spec: { type: string }
                                specialty: { type: string }
                          models:
                            type: array
                            items:
                              $ref: '#/components/schemas/RfpModel'
                  recipient_email: { type: string, format: email }
                  closed:
                    type: boolean
                    description: True when the RFP is no longer receiving proposals.
                  questions_open:
                    type: boolean
                    description: 'Whether this recipient may still ask (PRD-08 H-6/H-9): the RFP is published and its questions deadline has not passed.'
                  clarifications:
                    type: array
                    description: 'Every ANSWERED question of the RFP (public to all its bidders, asker never shown) plus this recipient''s own open ones (`mine`).'
                    items:
                      $ref: '#/components/schemas/Clarification'
                  proposal:
                    nullable: true
                    allOf:
                    - $ref: '#/components/schemas/Proposal'
        '404':
          $ref: '#/components/responses/NotFound'
