  responses:
    Unauthenticated:
      description: No valid Clerk session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotEntitled:
      description: 402 not_entitled — the org's plan does not cover this (upgrade_hint)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 forbidden (role) | out_of_scope | not_a_participant | two_sided_rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (or not visible to this viewer)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 version_conflict | invalid_transition | dependency_cycle
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: 422 validation_failed | too_deep
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - unauthenticated
          - not_a_participant
          - forbidden
          - out_of_scope
          - two_sided_rule
          - not_entitled
          - not_found
          - gone
          - version_conflict
          - invalid_transition
          - dependency_cycle
          - too_deep
          - validation_failed
          - rate_limited
        detail:
          type: string
        reason:
          type: string
          description: role | relationship | entitlement
        upgrade_hint:
          oneOf:
          - type: string
          - type: 'null'
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        cycle:
          type: array
          items: &id001
            type: string
            format: uuid
        current:
          description: current state on version_conflict
      required:
      - type
      - title
      - status
      - code
      description: RFC 9457 problem+json
    Money:
      type: object
      properties:
        amount_cents:
          type: integer
          format: int64
        currency:
          type: string
          enum:
          - EUR
      required:
      - amount_cents
      - currency
    Visibility:
      type: object
      properties:
        commercial: &id002
          type: boolean
        reason:
          type: string
      description: Present when fields were withheld from this viewer. Withheld fields are ABSENT, never null.
    Page:
      type: object
      properties:
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
    Actor:
      type: object
      properties:
        person_id: *id001
        org_id: *id001
        org_role:
          type: string
    Me:
      type: object
      properties:
        person:
          $ref: '#/components/schemas/Person'
        active_org:
          $ref: '#/components/schemas/Organization'
        org_role:
          type: string
        permissions:
          type: array
          items:
            type: string
        organizations:
          type: array
          items:
            type: object
            properties:
              org:
                $ref: '#/components/schemas/Organization'
              org_role:
                type: string
        pending_project_invitations:
          type: array
          items:
            $ref: '#/components/schemas/ProjectInvitation'
    Person:
      type: object
      properties:
        id: *id001
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
