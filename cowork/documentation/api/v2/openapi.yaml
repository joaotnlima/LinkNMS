  responses:
    Unauthenticated:
      description: No valid Clerk session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotEntitled:
      description: 402 not_entitled — the org's plan does not cover this (upgrade_hint)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 forbidden (role) | out_of_scope | not_a_participant | two_sided_rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (or not visible to this viewer)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 version_conflict | invalid_transition | dependency_cycle
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: 422 validation_failed | too_deep
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - unauthenticated
          - not_a_participant
          - forbidden
          - out_of_scope
          - two_sided_rule
          - not_entitled
          - not_found
          - gone
          - version_conflict
          - invalid_transition
          - dependency_cycle
          - too_deep
          - validation_failed
          - rate_limited
        detail:
          type: string
        reason:
          type: string
          description: role | relationship | entitlement
        upgrade_hint:
          oneOf:
          - type: string
          - type: 'null'
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        cycle:
          type: array
          items: &id001
            type: string
            format: uuid
        current:
          description: current state on version_conflict
      required:
      - type
      - title
      - status
      - code
      description: RFC 9457 problem+json
    Money:
      type: object
      properties:
        amount_cents:
          type: integer
          format: int64
        currency:
          type: string
          enum:
          - EUR
      required:
      - amount_cents
      - currency
    Visibility:
      type: object
      properties:
        commercial: &id002
          type: boolean
        reason:
          type: string
      description: Present when fields were withheld from this viewer. Withheld fields are ABSENT, never null.
    AskCandidate:
      type: object
      description: One task of a build as "Ask for a proposal" offers it to a company (PRD-04 X-6, X-7).
      properties:
        task_id:
          type: string
          format: uuid
        code:
          type: string
          description: The row's outline code ("2.5").
        name:
          type: string
        specialty_code:
          oneOf:
          - type: string
          - type: 'null'
        specialty_match:
          type: boolean
        rfp:
          description: The governing RFP the viewer's organisation issued for the row, if any.
          oneOf:
          - type: 'null'
          - type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              status:
                type: string
              invited_count:
                type: integer
        target:
          type: object
          properties:
            kind:
              type: string
              enum:
              - draft
              - new
              - locked
            rfp_id:
              type: string
              format: uuid
              description: With `draft`.
            reason:
              type: string
              description: With `locked`.
          required:
          - kind
      required:
      - task_id
      - name
      - specialty_match
      - target
    SpecialtyLabel:
      type: object
      properties:
        label:
          type: string
      required:
      - label
    Page:
      type: object
      properties:
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
    Actor:
      type: object
      properties:
        person_id: *id001
        org_id: *id001
        org_role:
          type: string
    Me:
      type: object
      properties:
        person:
          $ref: '#/components/schemas/Person'
        active_org:
          $ref: '#/components/schemas/Organization'
        org_role:
          type: string
        permissions:
          type: array
          items:
            type: string
        assignable_roles:
          type: array
          description: The catalogue roles the active organisation can hand out (its kind's role set, doc 16 §4)
            — what the member-management screen offers (PRD-12 N-9). Empty without an active org.
          items:
            $ref: '#/components/schemas/OrgRole'
        organizations:
          type: array
          items:
            type: object
            properties:
              org:
                $ref: '#/components/schemas/Organization'
              org_role:
                type: string
        pending_project_invitations:
          type: array
          items:
            $ref: '#/components/schemas/ProjectInvitation'
    OrgRole:
      type: string
      description: Catalogue role inside an organisation (doc 16 §4); each org kind hands out its role set only.
      enum:
      - admin
      - manager
      - representative
      - site_lead
      - finance
      - member
      - inspector
    Member:
      description: A person in my organisation with their catalogue role (PRD-12 N-9).
      allOf:
      - $ref: '#/components/schemas/Person'
      - type: object
        properties:
          org_role:
            $ref: '#/components/schemas/OrgRole'
        required:
        - org_role
    MemberInvitation:
      type: object
      properties:
        id:
          type: string
          description: Clerk invitation id
        email:
          type: string
          format: email
        org_role:
          $ref: '#/components/schemas/OrgRole'
        status:
          type: string
          enum:
          - pending
      required:
      - id
      - email
      - org_role
      - status
    Person:
      type: object
      properties:
        id: *id001
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        locale:
          type: string
          enum:
          - pt-PT
          - en
          - es
      required:
      - id
      - email
      - name
    Organization:
      type: object
      properties:
        id: *id001
        kind:
          type: string
          enum:
          - household
          - contractor
          - consultant
          - supplier
        legal_name:
          type: string
        nif:
          type: string
        approval_policy:
          type: string
          enum:
          - any
          - all
      required:
      - id
      - kind
      - legal_name
    Staffing:
      type: object
      properties:
        project_id: *id001
        org_id: *id001
        person_id: *id001
    OrganizationProfile:
      type: object
      description: The editor's view of a directory profile (the owning organisation only). Credentials are stated
        (D-17 as amended by D-46), never checked.
      properties:
        org_id: *id001
        slug:
          type: string
          description: Minted from the display name at creation, numeric suffix on collision; frozen (to-be/20 §5.2)
        display_name:
          type: string
        kind:
          type: string
          enum:
          - contractor
          - consultant
          - supplier
        claimed: *id002
        description:
          type: string
        specialties:
          type: array
          items:
            type: string
          description: Taxonomy codes (listSpecialties)
        tags:
          type: array
          items:
            type: string
        service_areas:
          type: array
          items:
            type: string
            description: INE municipality or district code
        base:
          $ref: '#/components/schemas/DirectoryBase'
        service_radius_km:
          type: integer
          minimum: 1
          maximum: 300
        team_size_band:
          type: string
          enum:
          - '1'
          - 2-5
          - 6-20
          - 21-50
          - 50+
        founded_year:
          type: integer
        available_from:
          type: string
          format: date
          description: Stated — when the company can start new work
        declared:
          type: object
          properties:
            nif:
              type: string
            impic_number:
              type: string
            impic_class:
              type: string
            insurance:
              type: string
          description: Stated (D-17, D-46), never shown as checked
        listed: *id002
        completeness:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        version:
          type: integer
      required:
      - org_id
      - slug
      - display_name
      - claimed
      - listed
      - completeness
      - version
    OrganizationProfileWrite:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        specialties:
          type: array
          maxItems: 30
          items:
            type: string
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 40
        service_areas:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: ^\d{2}(\d{2})?$
        base:
          $ref: '#/components/schemas/DirectoryBase'
        service_radius_km:
          type: integer
          minimum: 1
          maximum: 300
        team_size_band:
          type: string
          enum:
          - '1'
          - 2-5
          - 6-20
          - 21-50
          - 50+
        founded_year:
          type: integer
        available_from:
          oneOf:
          - type: string
            format: date
          - type: 'null'
        declared:
          type: object
          properties:
            nif:
              type: string
            impic_number:
              type: string
            impic_class:
              type: string
            insurance:
              type: string
        listed: *id002
      required:
      - display_name
    DirectoryBase:
      type: object
      description: Where the company works from (R-3). A point gives distances; the municipality alone does not.
      properties:
        municipality_code:
          type: string
          pattern: ^\d{4}$
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    Completeness:
      type: object
      properties:
        score:
          type: integer
